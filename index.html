<style>
  :root {
    /* 延續「金香壇代禱卡」：米白紙色、石榴紅、楷體、石榴籽 */
    --paper: #F2F1E4;       /* 頁面底色 */
    --sheet: #FBFAF2;       /* 卡片紙 */
    --ink: #2E322F;
    --muted: #767B73;
    --line: #A8ACA4;        /* 外框 */
    --rule: #D9D8CC;        /* 內部分隔 */
    --olive: #B6A359; --olive-ink: #8A7A2E; --leaf: #8DB38A;
    --line-green: #06C755; --share-ink: #0B8F45;
    --stamp: #A12A3C;
    --kai: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", serif;
    --sans: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    /* 每面代禱牆的色調（預設石榴紅） */
    --bar: #A12A3C; --g2: #6F1A28; --pill: #E7C9CD;
  }
  /* 深色主題（延續金香壇代禱卡的深色配色） */
  :root[data-mode="dark"] {
    --paper: #1D1A19; --sheet: #262220; --ink: #EDE9DF; --muted: #A6A198; --line: #4E4A46; --rule: #3A3532;
    --olive: #C9B66A; --olive-ink: #C9B66A; --leaf: #7FA27C; --share-ink: #3DD374; --stamp: #E0707F;
    --bar: #D55A6B; --g2: #F2929E; --pill: #4A2A30;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--olive); outline-offset: 2px; }
  [hidden] { display: none !important; }
  #app { max-width: 560px; margin: 0 auto; padding: 20px 16px calc(120px + env(safe-area-inset-bottom)); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .kai { font-family: var(--kai); }

  /* ---------- 平台頂部 ---------- */
  header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; padding-top: env(safe-area-inset-top); }
  header.top .brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; border-radius: 12px; }
  header.top .logo { width: 48px; height: 48px; flex: none; display: block; }
  header.top .logo svg { width: 100%; height: 100%; display: block; }
  header.top h1 { font-family: var(--kai); font-weight: 700; font-size: clamp(1.1rem, 5.4vw, 1.5rem); letter-spacing: .06em; margin: 0; line-height: 1.25; }
  header.top .sub { margin: 2px 0 0; color: var(--muted); font-size: .85rem; letter-spacing: .04em; }
  .top-acts { display: flex; gap: 8px; flex: none; }
  .mode-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  .mode-btn svg { width: 19px; height: 19px; }
  header.top.slim { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--rule); }
  header.top.slim .logo { width: 34px; height: 34px; }
  header.top.slim h1 { font-size: clamp(1rem, 4.6vw, 1.2rem); }
  .help { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--muted); font-weight: 700; cursor: pointer; }
  .demo-note { background: rgba(182,163,89,.18); color: var(--olive-ink); font-size: 13px; padding: 8px 12px; border-radius: 12px; margin: 0 0 10px; }

  .tabs { display: flex; align-items: center; gap: 16px; border-bottom: 1.5px solid var(--line); margin: 4px 0 18px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; white-space: nowrap; background: none; border: 0; padding: 10px 0; font-family: var(--kai); font-size: 16px; letter-spacing: .04em; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1.5px; cursor: pointer; }
  .tabs button.tab-new { margin: 0 0 0 auto; padding: 6px 16px; border: 0; border-radius: 999px; background: var(--bar); color: #fff; font-family: var(--sans); font-weight: 700; font-size: 15px; letter-spacing: .04em; box-shadow: 0 4px 12px -6px var(--g2); }
  .tabs button.tab-new[aria-selected="true"] { background: var(--g2); color: var(--paper); border: 0; }
  .tabs button .ti.admin { width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid var(--olive); background: linear-gradient(var(--olive) 0 0) 50% 30% / 60% 2px no-repeat, linear-gradient(var(--olive) 0 0) 50% 70% / 60% 2px no-repeat; }
  .tabs button[aria-selected="true"] { color: var(--g2); border-bottom-color: var(--bar); font-weight: 700; }
  .tabs .n { font-family: var(--sans); font-size: 12px; margin-left: 4px; }
  .subbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 0 14px; }
  .back { background: none; border: 0; padding: 6px 0; font-size: 16px; color: var(--muted); cursor: pointer; }
  .subbar h1 { font-family: var(--kai); font-size: 19px; letter-spacing: .08em; margin: 0; color: var(--g2); }

  /* ---------- 紙卡、表單 ---------- */
  .card { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 26px; padding: 22px 18px 20px; margin: 0 0 16px; position: relative; overflow: hidden; }
  .card.dot::before { content: ""; position: absolute; right: -26px; top: -26px; width: 96px; height: 96px; border-radius: 50%; background: var(--bar); opacity: .12; }
  .card > h2 { position: relative; font-family: var(--kai); font-weight: 700; font-size: 1.45rem; letter-spacing: .1em; color: var(--g2); margin: 0 0 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card > h2 small { font-family: var(--sans); font-size: 13px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
  .step { font-size: 15px; font-weight: 700; margin: 4px 0 10px; color: var(--ink); }
  .step b { font-family: var(--kai); color: var(--bar); margin-right: 4px; }
  .field { display: block; margin-bottom: 16px; }
  .field > span { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .field > span em { font-style: normal; font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .field input, .field textarea, .inp { width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; font-size: 16px; min-height: 48px; }
  .field textarea, textarea.inp { min-height: 96px; resize: vertical; line-height: 1.7; }
  #names { font-family: var(--kai); font-size: 18px; }
  .field input:focus, .field textarea:focus, .inp:focus { border-color: var(--bar); outline: none; box-shadow: 0 0 0 3px var(--pill); }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 2px 0; line-height: 1.6; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .presets button { background: transparent; border: 1px solid var(--olive); border-radius: 999px; padding: 3px 12px; font-size: 13px; color: var(--olive-ink); cursor: pointer; }

  .btn { appearance: none; display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; border: 1.5px solid var(--bar); border-radius: 999px; padding: 12px 18px; min-height: 48px; font-size: 16px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; background: transparent; color: var(--bar); letter-spacing: .04em; }
  .btn.send { background: var(--bar); color: #fff; box-shadow: 0 6px 16px -8px var(--g2); }
  .btn.send:active { background: var(--g2); }
  .btn.line { background: var(--line-green); border-color: var(--line-green); color: #fff; }
  .btn.share { border-color: var(--line-green); color: var(--share-ink); background: transparent; }
  .btn.plain { background: transparent; }
  .btn.ghost { border-color: var(--line); color: var(--muted); font-weight: 500; }
  .btn.code { border-color: var(--olive); color: var(--olive-ink); font-weight: 500; }
  .btn.danger { border-color: rgba(161,42,60,.45); color: var(--stamp); font-weight: 500; }
  .btn.danger.armed { background: var(--stamp); color: #fff; border-color: var(--stamp); }
  .btn.small { display: inline-flex; width: auto; padding: 6px 14px; min-height: 38px; font-size: 14px; font-weight: 500; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .btn-grid .btn { font-size: 15px; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--paper) 70%, transparent); z-index: 5; }
  .dock .inner { max-width: 528px; margin: 0 auto; }

  /* 開關 */
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 4px 0; }
  .switch-row b { display: block; font-size: 15px; }
  .switch-row small { display: block; color: var(--muted); font-size: 13px; }
  .switch { position: relative; flex: none; width: 52px; height: 30px; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .switch input:checked + span { background: var(--line-green); }
  .switch input:checked + span::after { transform: translateX(22px); }
  .switch input:focus-visible + span { outline: 3px solid var(--olive); outline-offset: 2px; }

  /* ---------- 代禱牆頁首（石榴插畫＋題字） ---------- */
  .hero { position: relative; display: grid; grid-template-columns: 46% 1fr; align-items: center; min-height: 190px; border-radius: 26px; overflow: hidden; background: var(--sheet); border: 1.5px solid var(--line); box-shadow: 0 6px 18px rgba(60,20,25,.12); margin-bottom: 16px; }
  .hero .art { align-self: stretch; position: relative; }
  .hero .art svg { position: absolute; left: -18%; top: 50%; width: 125%; transform: translateY(-50%); }
  .hero .label { position: relative; margin: 18px 14px 18px 0; padding: 14px 12px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); text-align: center; }
  .hero .tag { font-size: 12px; color: var(--bar); border: 1px solid var(--bar); border-radius: 999px; padding: 0 9px; display: inline-block; letter-spacing: .1em; }
  .hero h1 { font-family: var(--kai); font-weight: 700; font-size: 1.75rem; line-height: 1.3; letter-spacing: .14em; margin: 6px 0 0; color: var(--ink); word-break: break-word; }
  .intro { margin: 0 4px 14px; color: var(--muted); font-size: 15px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--sheet); margin-bottom: 16px; }
  .stats div { padding: 10px 4px 8px; text-align: center; }
  .stats div + div { border-left: 1px solid var(--line); }
  .stats b { display: block; font-family: var(--kai); font-size: 30px; line-height: 1.15; color: var(--g2); }
  .stats span { font-size: 12px; color: var(--muted); }
  .seeds { display: flex; flex-wrap: wrap; gap: 5px; margin: -4px 4px 16px; }
  .seed { width: 9px; height: 13px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: var(--pill); }
  .seed.f { background: var(--bar); }
  .closed-note { background: rgba(182,163,89,.18); color: var(--olive-ink); border-radius: 14px; padding: 10px 14px; font-size: 14px; margin: 0 0 16px; }
  .verse { margin: 26px 4px 0; font-family: var(--kai); color: var(--muted); font-size: 1rem; line-height: 1.9; letter-spacing: .05em; border-left: 3px solid var(--olive); padding-left: 12px; }
  .verse cite { display: block; font-style: normal; font-size: .85rem; }

  /* 選排 */
  .group-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .group-pick button { display: flex; align-items: center; justify-content: space-between; gap: 6px; text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; min-height: 52px; font-family: var(--kai); font-size: 16px; cursor: pointer; line-height: 1.35; }
  .group-pick button .c { flex: none; font-family: var(--sans); font-size: 12px; color: var(--muted); }
  .group-pick button[aria-pressed="true"] { background: var(--bar); border-color: var(--bar); color: #fff; }
  .group-pick button[aria-pressed="true"] .c { color: rgba(255,255,255,.85); }
  .group-pick button.add { justify-content: center; border-style: dashed; color: var(--muted); font-family: var(--sans); font-size: 14px; }
  .new-group { display: flex; gap: 8px; margin-top: 10px; }
  .new-group .inp { min-height: 44px; }

  /* 各排名單 */
  .wall-group { position: relative; padding: 12px 0; border-top: 1px dashed var(--rule); }
  .wall-group:first-of-type { border-top: 0; padding-top: 0; }
  .wall-group h3 { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 8px; font-family: var(--kai); font-size: 18px; letter-spacing: .06em; color: var(--g2); }
  .wall-group h3 small { font-family: var(--sans); color: var(--muted); font-weight: 400; font-size: 13px; letter-spacing: 0; }
  .wall-group.empty h3 { color: var(--muted); font-weight: 400; margin: 0; }
  .names { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .name { position: relative; display: flex; align-items: center; min-height: 46px; padding: 6px 6px 6px 30px; font-family: var(--kai); font-size: 17px; border-bottom: 1px solid var(--rule); }
  .name:nth-child(odd) { border-right: 1px solid var(--rule); }
  .name:nth-last-child(1), .name:nth-last-child(2):nth-child(odd) { border-bottom: 0; }
  .name::before { content: ""; position: absolute; left: 11px; top: 50%; width: 10px; height: 14px; margin-top: -7px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: var(--bar); }
  .name span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .name.fresh { animation: pop .8s ease; }
  @keyframes pop { 0% { background: var(--pill); } 100% { background: transparent; } }
  .name button { flex: none; border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; line-height: 1; cursor: pointer; }
  .name button:hover { background: rgba(0,0,0,.05); color: var(--stamp); }
  .name button.armed { background: var(--stamp); color: #fff; font-size: 12px; width: auto; padding: 0 8px; border-radius: 999px; }
  .posted { color: var(--share-ink); font-size: 14px; margin: 10px 0 0; }
  .posted.warn { color: var(--stamp); }
  .page-foot { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 18px; margin: 22px 0 0; }
  .link { background: none; border: 0; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 0; }

  /* ---------- 個人代禱卡（同金香壇代禱卡） ---------- */
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 16px; }
  .day { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 12px; padding: 6px 0 5px; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; min-height: 52px; }
  .day .wd { font-family: var(--kai); font-size: .95rem; line-height: 1.3; }
  .day .ct { font-size: .66rem; color: var(--muted); line-height: 1.3; white-space: nowrap; }
  .day.today::after { content: ""; position: absolute; top: -4px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--olive); border: 2px solid var(--paper); }
  .day.on { background: var(--bar); border-color: var(--bar); color: #fff; }
  .day.on .ct { color: rgba(255,255,255,.85); }
  .pcard { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 26px; padding: 22px 18px 18px; position: relative; overflow: hidden; }
  .pcard::before { content: ""; position: absolute; right: -26px; top: -26px; width: 96px; height: 96px; border-radius: 50%; background: var(--bar); opacity: .12; }
  .pcard .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; position: relative; }
  .pcard .head .wd { font-size: .95rem; color: var(--muted); letter-spacing: .08em; }
  .pcard .head .tag { font-size: .75rem; color: var(--bar); border: 1px solid var(--bar); border-radius: 999px; padding: 0 8px; }
  .pcard .head h2 { font-family: var(--kai); font-weight: 700; font-size: 2.6rem; line-height: 1.1; margin: 4px 0 0; width: 100%; letter-spacing: .14em; color: var(--g2); }
  .pcard .seeds { margin: 14px 0 4px; min-height: 14px; }
  .count { margin: 0 0 14px; color: var(--muted); font-size: .85rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; }
  .cell, .cell-in { appearance: none; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-family: var(--kai); font-size: 1.15rem; min-height: 54px; padding: 8px 10px 8px 30px; text-align: left; position: relative; width: 100%; border-radius: 0; display: flex; align-items: center; gap: 6px; }
  .grid > :nth-child(2n) { border-right: 0; }
  .grid > :nth-last-child(-n+2) { border-bottom: 0; }
  .cell { padding: 0 4px 0 0; }
  .cell .mk { flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: 6px; border: 0; background: transparent; font: inherit; color: inherit; text-align: left; padding: 8px 4px 8px 30px; cursor: pointer; }
  .cell .mk > span:first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .cell .lt { flex: none; width: 38px; height: 38px; border: 0; border-radius: 50%; background: transparent; color: var(--olive-ink); cursor: pointer; display: grid; place-items: center; }
  .cell .lt svg { width: 20px; height: 20px; }
  .cell .lt:hover, .cell .lt:active { background: rgba(182,163,89,.16); color: var(--bar); }
  .cell.done .lt { color: var(--muted); }
  .cell.empty-cell::before { border-style: dashed; opacity: .5; }
  .cell::before { content: ""; position: absolute; left: 11px; top: 50%; width: 10px; height: 14px; margin-top: -7px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; border: 1.5px solid var(--line); }
  .cell.done::before { background: var(--bar); border-color: var(--bar); }
  .cell.done { color: var(--muted); }
  .cell:disabled { cursor: default; }
  .cell:disabled::before { border-style: dashed; opacity: .5; }
  .cell-in { background: var(--paper); outline: none; padding-left: 12px; }
  .cell-in:focus { background: var(--sheet); box-shadow: inset 0 0 0 2px var(--pill); }
  .cell-in::placeholder { color: var(--line); }
  .wb { flex: none; font-family: var(--sans); font-size: 11px; color: var(--olive-ink); border: 1px solid var(--olive); border-radius: 999px; padding: 0 6px; line-height: 1.5; }
  .empty { margin: 14px 2px 0; color: var(--muted); font-size: .9rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; position: relative; }
  .actions .btn { width: auto; flex: 0 0 auto; padding: 10px 18px; min-height: 44px; font-size: .95rem; font-weight: 500; }
  .actions .btn.send, .actions .btn.line { font-weight: 700; }
  .actions.tools { margin-top: 8px; }
  .actions.tools .btn { font-size: .85rem; padding: 7px 13px; min-height: 38px; }
  .btn.edit { border-color: var(--bar); color: var(--bar); }
  .cat-edit { margin: 12px 0 10px; }
  .cat-edit input { font-family: var(--kai); font-size: 18px; }
  .paste { margin-top: 14px; border: 1px dashed var(--olive); border-radius: 16px; padding: 12px 14px; }

    case 'getCard': return { ok: true, card: JSON.parse(JSON.stringify(demo.card)), onWall: demo.onWall, walls: demo.walls.map(demoView) };
    case 'saveCard': demo.card = JSON.parse(JSON.stringify(d.card)); return { ok: true, card: d.card };
    case 'myData': return { ok: true, displayName: demo.me.displayName, entries: [{ wall: '小區福音代禱牆', group: '霧峰姊妹排', name: '康英滿', time: '2026/11/20' }], walls: ['小區福音代禱牆'] };
    case 'deleteMyData': return { ok: true, entries: 1 };
  }
  throw new Error('預覽模式不支援：' + action);
}

/* ================= 登入與後端 ================= */
const SESSION_KEY = 'pw.session';
const getSession = () => { try { const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); return s && s.expires > Date.now() + 60000 ? s : null; } catch (e) { return null; } };
const setSession = s => { try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify({ token: s.token, expires: s.expires })) : localStorage.removeItem(SESSION_KEY); } catch (e) {} };
const CACHE_OK = !DEMO;
const cacheGet = k => { if (!CACHE_OK) return null; try { return JSON.parse(localStorage.getItem('pw.c.' + k) || 'null'); } catch (e) { return null; } };
const cacheSet = (k, v) => { if (!CACHE_OK) return; try { localStorage.setItem('pw.c.' + k, JSON.stringify(v)); } catch (e) {} };

async function api(action, data = {}) {
  if (DEMO) return demoApi(action, data);
  const body = { action, ...data };
  const s = action === 'session' ? null : getSession();
  if (s) body.session = s.token; else { await LIFF_READY; body.idToken = liff.getIDToken(); }
  const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'SESSION_EXPIRED') {
      setSession(null); await LIFF_READY;
      if (liff.isLoggedIn()) return api(action, data);
      liff.login({ redirectUri: location.href }); throw new Error('登入已過期，正在重新登入');
    }
    if (j.error === 'TOKEN_EXPIRED') { await LIFF_READY; liff.logout(); liff.login({ redirectUri: location.href }); throw new Error('登入已過期，正在重新登入'); }
    throw new Error(j.error);
  }
  return j;
}

/* ================= 入口 ================= */
async function main() {
  try {
    if (PARAMS.has('install')) return installFlow();
    if (!DEMO && (!getSession() || PARAMS.has('liff.state'))) {
      // 第一次登入，或 LINE 帶著 liff.state 轉址時，才需要等 LINE 初始化
      await LIFF_READY;
      if (!liff.isLoggedIn() && !getSession()) { liff.login({ redirectUri: location.href }); return; }
      if (liff.isLoggedIn() && !getSession()) { try { setSession(await api('session')); } catch (e) {} }
    }
    const wallId = PARAMS.get('wall') || (DEMO && ['wall', 'invite'].includes(PARAMS.get('demo')) ? 'W1' : '');
    const shareId = PARAMS.get('share');
    if (PARAMS.has('mydata')) await myDataFlow();
    else if (shareId) await forwardFlow(shareId);
    else if (wallId) await wallFlow(wallId);
    else await platformFlow();
  } catch (e) {
    view(`<section class="solo"><div class="msg-card"><div style="font-size:34px">🙏</div><h1>無法開啟</h1><p>${esc(e.message)}</p><p class="muted small">請關閉後從 LINE 重新開啟一次。</p></div></section>`);
  }
}

async function wallFlow(id) {
  const cached = cacheGet('wall.' + id);

  try {
    const r = await api('wall', { wallId: id });

}

let SCROLL_KEEP = 0;
/** 重畫時保留捲動位置與還沒送出的名字 */
function keepTyped(fn) {
  const typed = $('names') ? $('names').value : '';

async function submitNames() {
  const btn = $('submit');
  const names = splitNames($('names').value);
  if (!PICK) { toast('請先選擇你的排'); document.querySelector('.group-pick').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if (!names.length) { toast('請填入至少一位福音朋友的名字'); $('names').focus(); return; }
  if (names.length > 30) { toast('一次最多填 30 位，請分次送出'); return; }
  btn.disabled = true; btn.textContent = '送出中…';
  const auto = $('autopost') && $('autopost').checked;
  try {
    const cdBtn = document.querySelector('[data-cd][aria-pressed="true"]');
    const cardDay = $('tocard') && $('tocard').checked && cdBtn ? +cdBtn.dataset.cd : null;
    const r = await api('addNames', { wallId: WALL.id, group: PICK, names, cardDay });
    if (r.cardAdded) { try { localStorage.removeItem('pw.c.card'); } catch (e) {} }
    WALL = r.wall; cacheSet('wall.' + WALL.id, WALL);
    const g = WALL.list.find(x => x.name === r.group);
    if (g) g.names.filter(n => r.added.includes(n.name)).forEach(n => FRESH.add(n.id));
    SCROLL_KEEP = 0; drawWall();
    const say = r.added.length ? `已為${r.group}加入 ${r.added.length} 位${r.skipped.length ? `（${r.skipped.join('、')} 已經在名單上）` : ''}` : `${r.skipped.join('、')} 已經在名單上了`;

    if (auto && r.added.length) await postWall(WALL, `${r.group} 加入了 ${r.added.length} 位`);
    const list = $('list-h'); if (list) setTimeout(() => list.scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
  } catch (e) {
    toast(e.message); btn.disabled = false; btn.innerHTML = `${ICON_SEND}送出代禱名單`;
  }
}

/** 以使用者名義在原本的聊天室貼出最新的代禱牆圖卡 */
async function postWall(w, news) {
  const note = $('posted');
  const say = (t, warn) => { if (note) { note.hidden = false; note.textContent = t; note.classList.toggle('warn', !!warn); } else toast(t); };
  if (DEMO) { say('預覽模式：正式版會在群組貼出最新的代禱牆圖卡'); return true; }
  await LIFF_READY.catch(() => {});
  if (!canPost()) { say('要從群組裡的圖卡打開，才能貼回聊天室。也可以用「轉傳給其他群組或朋友」。', true); return false; }
  try {
    if (liff.permission) {
      const p = await liff.permission.query('chat_message.write').catch(() => null);
      if (p && p.state === 'prompt') await liff.permission.requestAll().catch(() => {});
    }
    await liff.sendMessages([buildWallFlex(w, news)]);
    say('已把最新的代禱牆貼到聊天室');
    return true;
  } catch (e) {
    say(`沒有貼到聊天室（${e.code ? e.code + '：' : ''}${e.message}）。名單已經送出。`, true);
    return false;
  }
}

/* ================= 群組裡的圖卡（Flex Message） ================= */
const FLEX_LIMIT = 27000; // LINE 單張圖卡約 30KB 上限，留一點餘裕
const byteLen = o => new TextEncoder().encode(JSON.stringify(o)).length;
const C = { sheet: '#FBFAF2', ink: '#2E322F', muted: '#767B73', line: '#A8ACA4', rule: '#D9D8CC' };
const pill = (text, t) => ({ type: 'box', layout: 'vertical', flex: 0, backgroundColor: t.pill, cornerRadius: 'xxl', paddingStart: '10px', paddingEnd: '10px', paddingTop: '2px', paddingBottom: '2px',
  contents: [{ type: 'text', text, size: 'xs', weight: 'bold', color: t.bar }] });
const seedDot = t => ({ type: 'box', layout: 'vertical', width: '9px', height: '13px', cornerRadius: '5px', backgroundColor: t.bar, contents: [] });
const statBox = (n, label, t) => ({ type: 'box', layout: 'vertical', flex: 1, paddingTop: '8px', paddingBottom: '8px', contents: [
  { type: 'text', text: String(n), size: 'xxl', weight: 'bold', color: t.g2, align: 'center' },
  { type: 'text', text: label, size: 'xxs', color: C.muted, align: 'center' } ] });

function buildWallFlex(w, news, opt = {}) {
  const t = themeOf(w);
  const perGroup = opt.perGroup || 40, maxGroups = opt.maxGroups || 40;
  const filled = w.list.filter(g => gcount(g)), empty = w.list.filter(g => !gcount(g));
  const shown = filled.slice(0, maxGroups);
  // 群組圖卡不放名字（名單只給加入的人看），只列各排人數
  const groupBox = g => ({ type: 'box', layout: 'horizontal', spacing: 'md', alignItems: 'center', borderColor: C.rule, borderWidth: '1px', cornerRadius: 'lg', paddingAll: '10px', paddingStart: '12px', contents: [
    seedDot(t),
    { type: 'text', text: g.name, weight: 'bold', size: 'sm', color: t.g2, flex: 1, wrap: true },
    pill(`${gcount(g)} 位`, t) ] });
  const list = shown.map(groupBox);
  if (filled.length > shown.length) list.push({ type: 'text', text: `…還有 ${filled.length - shown.length} 個排`, size: 'xs', color: C.muted, wrap: true, margin: 'sm' });
  if (empty.length) list.push({ type: 'text', text: `還沒有名單：${empty.map(g => g.name).join('、')}`.slice(0, 300), size: 'xs', color: C.muted, wrap: true, margin: 'sm' });
  if (!list.length) list.push({ type: 'text', text: '還沒有人填寫，第一位來為福音朋友代禱吧！', size: 'sm', color: C.muted, wrap: true, align: 'center' });
  list.push({ type: 'text', text: '名單只給加入的人看。', size: 'xxs', color: C.muted, wrap: true, margin: 'md', align: 'center' });

  const head = [];
  if (w.tag) head.push({ type: 'box', layout: 'horizontal', contents: [{ type: 'box', layout: 'vertical', flex: 0, borderColor: t.bar, borderWidth: '1px', cornerRadius: 'xxl', paddingStart: '9px', paddingEnd: '9px',
    contents: [{ type: 'text', text: w.tag, size: 'xs', color: t.bar }] }] });
  head.push({ type: 'text', text: w.title, color: t.g2, weight: 'bold', size: 'xxl', wrap: true, margin: 'sm' });
  if (w.verse) head.push({ type: 'text', text: w.verse, color: C.muted, size: 'xs', wrap: true, margin: 'sm' });
  head.push({ type: 'box', layout: 'horizontal', margin: 'lg', borderColor: C.line, borderWidth: '1px', cornerRadius: 'lg', contents: [
    statBox(w.total, '位福音朋友', t), { type: 'separator', color: C.line }, statBox(w.filled, '個排已填', t), { type: 'separator', color: C.line }, statBox(w.unfilled, '個排未填', t)] });

  const flex = {
    type: 'flex',
    altText: `🙏 ${w.title}：${news ? news + '，' : ''}共 ${w.total} 位福音朋友，${w.filled} 個排已填`.slice(0, 400),
    contents: {
      type: 'bubble', size: 'mega',
      styles: { body: { backgroundColor: C.sheet }, footer: { backgroundColor: C.sheet } },
      hero: { type: 'image', url: `${SITE}img/hero-${w.theme in THEMES ? w.theme : 'pom'}.jpg`, size: 'full', aspectRatio: '20:9', aspectMode: 'cover', action: { type: 'uri', uri: wallUrl(w.id) } },
      body: { type: 'box', layout: 'vertical', paddingAll: '18px', spacing: 'md', contents: [
        { type: 'box', layout: 'vertical', contents: head },
        { type: 'box', layout: 'vertical', spacing: 'sm', margin: 'lg', contents: list } ] },
      footer: { type: 'box', layout: 'vertical', paddingAll: '14px', paddingTop: '0px', paddingBottom: '6px', contents: [
        { type: 'button', style: 'primary', color: t.bar, height: 'sm', action: { type: 'uri', label: w.open === false ? '打開代禱牆' : '🙏 加入代禱牆・一起代禱', uri: wallUrl(w.id) } },
        { type: 'box', layout: 'horizontal', margin: 'sm', contents: [
          { type: 'button', style: 'link', height: 'sm', color: t.bar, flex: 1, action: { type: 'uri', label: '我的代禱卡', uri: `https://liff.line.me/${LIFF_ID}?tab=card` } },
          { type: 'button', style: 'link', height: 'sm', color: C.muted, flex: 1, action: { type: 'uri', label: '轉傳', uri: shareUrl(w.id) } } ] } ] },
    },
  };
  if (byteLen(flex) <= FLEX_LIMIT) return flex;
  // 太大就逐步縮小：每排少列幾個名字，再不夠就少列幾個排
  if (perGroup > 12) return buildWallFlex(w, news, { perGroup: 12, maxGroups });
  if (perGroup > 5) return buildWallFlex(w, news, { perGroup: 5, maxGroups });
  if (maxGroups > 8) return buildWallFlex(w, news, { perGroup, maxGroups: Math.max(8, Math.floor(maxGroups * 0.7)) });
  return flex;
}

/* 截圖工具（modern-screenshot，MIT，放在 lib/），按下才載入 */
let SHOT_LIB = null;
function loadShotLib() {
  if (window.modernScreenshot) return Promise.resolve(window.modernScreenshot);
  return SHOT_LIB || (SHOT_LIB = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'lib/modern-screenshot.js';
    s.onload = () => window.modernScreenshot ? res(window.modernScreenshot) : rej(new Error('截圖工具載入失敗'));
    s.onerror = () => { SHOT_LIB = null; rej(new Error('截圖工具載入失敗，請再試一次')); };
    document.head.appendChild(s);
  }));
}
/** 在畫面外排一張要存的圖（不影響目前畫面），寬度和手機一樣 */
function offscreen(html, width = 390) {
  const box = document.createElement('div');
  box.style.cssText = `position:fixed;left:-10000px;top:0;width:${width}px;pointer-events:none`;
  box.innerHTML = html;
  document.body.appendChild(box);
  return { el: box.firstElementChild, done: () => box.remove() };
}
const isMobileUA = () => /Android|iPhone|iPad|iPod|Mobile|Line\//i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
async function saveImage(el, filename) {
  if (DEMO && PARAMS.has('noshot')) return toast('預覽模式：已產生圖片');
  const ms = await loadShotLib();
  await document.fonts.ready.catch(() => {});
  const blob = await ms.domToBlob(el, {
    scale: Math.min(3, Math.max(2, window.devicePixelRatio || 2)), type: 'image/png', width: Math.ceil(el.getBoundingClientRect().width),
    backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--paper').trim() || '#F2F1E4', timeout: 20000,
    style: { animation: 'none', transition: 'none', margin: '0', boxShadow: 'none' },
    filter: n => !(n.classList && n.classList.contains('no-shot')),
  });
  if (!blob) throw new Error('無法產生圖片');
  const file = new File([blob], filename, { type: 'image/png' });
  if (!isMobileUA()) {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);

  }

    try { if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return; } }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  showSaveSheet(blob, file, filename); // LINE 內建瀏覽器多半不能直接存：打開圖片讓人長按儲存
}
function showSaveSheet(blob, file, filename) {

}

const b64e = str => { const b = new TextEncoder().encode(str); let o = ''; b.forEach(x => o += String.fromCharCode(x)); return btoa(o).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };

function mergeCard(cur, inc) {
  const out = JSON.parse(JSON.stringify(cur)); let added = 0;
  for (let i = 0; i < 7; i++) {

/* 貼上一段文字（例如照片辨識出來的），遇到「週三」「家人」等標題就分到那一天 */
const CATIDX = { '家人': 0, '親戚': 1, '好友': 2, '同事': 3, '鄰居': 4, '聖徒': 5, '馬路': 6 }, DAYCH = { '日': 0, '天': 0, '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6 };
function parsePasted(txt, defDay) {
  const days = {}; let cur = defDay;
  const dayRe = /^(主日|[週周]\s*[一二三四五六]|星期[一二三四五六日天]|禮拜[一二三四五六日天])/, catRe = /(家人|親戚|好友|同事|鄰居|聖徒|馬路)/;
  String(txt || '').replace(/\r/g, '').split('\n').forEach(line => {
    let l = line.trim(); if (!l) return;
    const m = dayRe.exec(l), c = catRe.exec(l);
    if (m || c) {
      if (m) { const w = m[1].replace(/\s/g, ''); cur = w === '主日' ? 0 : DAYCH[w.slice(-1)]; } else cur = CATIDX[c[1]];
      l = l.replace(dayRe, '').replace(/^[\s\-－–—:：]*/, '').replace(/^(同事\s*[（(]\s*學\s*[)）]|家人|親戚|好友|同事|鄰居|聖徒|馬路)[\s\-－–—:：]*/, '').trim();
      if (!l) return;
    }
    l.split(/[\s,，、;；／/|｜•·・]+/).forEach(t => {
      t = t.replace(/^[\d０-９]+[\.．、)）]?\s*/, '').replace(/[.。,，;；:：!！?？()（）\[\]「」『』"'“”…]/g, '').trim();
      if (!t || /^[\d０-９]+$/.test(t) || t.length > 20) return;
      const arr = days[cur] = days[cur] || []; if (!arr.includes(t)) arr.push(t);
    });
  });
  return days;
}

          <input class="inp" id="me-name" maxlength="20" value="${esc(n.name)}" aria-label="名字">
          <select class="inp" id="me-group" aria-label="排">${w.list.map(x => `<option ${x.name === g.name ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
          <div class="m-acts"><button class="btn small send" id="me-save">儲存</button><button class="btn small ghost" id="me-cancel">取消</button></div>
        </div>` : `<label class="m-row"><input type="checkbox" data-ms="${esc(n.id)}" ${MSEL.has(n.id) ? 'checked' : ''}>
          <span class="m-name">${esc(n.name)}</span><span class="m-by">${esc(n.by || '')}${n.time ? `・${esc(n.time)}` : ''}</span>

}
function bindManage(w, redraw) {
  const box = $('d-manage');
  const re = () => { box.innerHTML = manageHtml(w); bindManage(w, redraw); };
  $('m-q').oninput = e => { MFILTER = e.target.value; const pos = e.target.selectionStart; re(); const q = $('m-q'); q.focus(); q.setSelectionRange(pos, pos); };
  $('m-all').onchange = e => { const ids = [...box.querySelectorAll('[data-ms]')].map(x => x.dataset.ms); ids.forEach(id => e.target.checked ? MSEL.add(id) : MSEL.delete(id)); re(); };
  box.querySelectorAll('[data-ms]').forEach(c => c.onchange = () => { c.checked ? MSEL.add(c.dataset.ms) : MSEL.delete(c.dataset.ms); re(); });
  box.querySelectorAll('[data-me]').forEach(b => b.onclick = e => { e.preventDefault(); MEDIT = b.dataset.me; re(); $('me-name').focus(); });
  if ($('me-cancel')) {
    $('me-cancel').onclick = () => { MEDIT = ''; re(); };
    $('me-save').onclick = async () => {
      const btn = $('me-save'); btn.disabled = true;
      try { const r = await api('editName', { wallId: w.id, entryId: MEDIT, name: $('me-name').value, group: $('me-group').value }); MEDIT = ''; redraw(r.wall); toast('已修改'); }
      catch (e) { toast(e.message); btn.disabled = false; }

  }

    <button class="btn small danger" data-sa="del" ${n ? '' : 'disabled'}>刪除</button></div>`;
function bindSelBar(id, after) {
  const bar = $(id); if (!bar) return;

    if (!WSEL.size) return toast('請先勾選代禱牆');

      b.disabled = true;
      try {
        if (b.dataset.sa === 'del') {
          const r = await api('deleteWalls', { wallIds: ids });
          WALLS = WALLS.filter(x => !r.deleted.includes(x.id)); JOINED = JOINED.filter(x => !r.deleted.includes(x.id));
          toast(`已刪除 ${r.deleted.length} 面代禱牆${r.skipped.length ? `（${r.skipped.length} 面沒有權限）` : ''}`);
        } else {
          const open = b.dataset.sa === 'open', r = await api('setOpenMany', { wallIds: ids, open });
          [WALLS, JOINED].forEach(arr => arr.forEach(x => { if (r.updated.includes(x.id)) x.open = open; }));

  });
}
function bindWallRows(scope, onOpen, after) {
  scope.querySelectorAll('[data-open]').forEach(b => b.onclick = () => onOpen(b.dataset.open));
  scope.querySelectorAll('[data-ws]').forEach(c => c.onchange = () => { c.checked ? WSEL.add(c.dataset.ws) : WSEL.delete(c.dataset.ws); after(); });

/* ================= 建立平台 ================= */
let ME = null, WALLS = [], TAB = ['card', 'walls', 'new'].includes(PARAMS.get('tab')) ? PARAMS.get('tab') : 'card', ROUTE = { view: 'tabs' };
const DRAFT_KEY = 'pw.draft';
const blankDraft = () => ({ title: '', tag: '同心代禱', verse: verseText(VERSES[0]), desc: DEFAULT_DESC, groups: [{ name: '', from: '' }], allowAdd: true, theme: 'pom' });
let draft = blankDraft();
let editDraft = null;

async function platformFlow() {
  resetTheme();
  try { const saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); if (saved && saved.groups) draft = { ...blankDraft(), ...saved }; } catch (e) {}
  const imp = PARAMS.get('import') || (/[#&]n=/.test(location.hash) ? location.hash : '');
  if (imp) { PENDING_IMPORT = decodeList(imp); if (PENDING_IMPORT) TAB = 'card'; }
  const cached = cacheGet('platform'), cachedCard = cacheGet('card'), cx = cacheGet('cardx');
  const boot = api('boot').then(r => [r.me, { walls: r.created }, r]); // 首頁資料一次拿齊（r.walls 是我參與的代禱牆）
  const manageId = PARAMS.get('manage');
  const apply = ([me, r, c]) => { ME = me; WALLS = r.walls; CARD = c.card; ON_WALL = c.onWall || {}; JOINED = c.walls || []; cacheSet('platform', { me: ME, walls: WALLS }); cacheSet('card', CARD); cacheSet('cardx', { onWall: ON_WALL, walls: JOINED }); };
  const first = () => {
    if (manageId && WALLS.some(w => w.id === manageId)) { TAB = 'walls'; go({ view: 'detail', id: manageId }); }
    else { render(); if (!PARAMS.has('notour')) maybeStartTour(); }
  };
  if (cached && cached.me && cachedCard) {
    ME = cached.me; WALLS = cached.walls || []; CARD = cachedCard; ON_WALL = (cx && cx.onWall) || {}; JOINED = (cx && cx.walls) || [];
    first();
    boot.then(res => { const wasAdmin = !!(ME && ME.isAdmin); apply(res); if (!!ME.isAdmin !== wasAdmin && ROUTE.view === 'tabs' && CARD_MODE === 'view') render(); else softRefresh(); }).catch(e => toast(e.message));
    return;
  }
  view(loading());
  apply(await boot);
  first();
}

function softRefresh() {
  const n = document.querySelector('[data-tab=walls] .n'); if (n) n.textContent = WALLS.length + JOINED.filter(w => !WALLS.some(x => x.id === w.id)).length;
  if (ROUTE.view !== 'tabs') return;
  if (TAB === 'walls') renderWallsTab();
  if (TAB === 'card' && CARD_MODE === 'view') renderCard();
}

const saveDraft = () => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch (e) {} };
function go(route) { ROUTE = route; render(); }

function render() {
  resetTheme();
  if (ROUTE.view === 'detail') return renderDetail(ROUTE.id);
  if (ROUTE.view === 'edit') return renderEdit(ROUTE.id);
  if (ROUTE.view === 'towall') return renderToWall();
  if (ROUTE.view === 'admin') return renderAdmin();
  if (ROUTE.view === 'mine') return renderMine();
  const wallCount = WALLS.length + JOINED.filter(w => !WALLS.some(x => x.id === w.id)).length;
  view(`
    <header class="top"><a class="brand" href="./" id="home" data-home aria-label="回到首頁"><span class="logo">${pomSvg()}</span><div><h1>我的代禱卡．小區代禱牆</h1><p class="sub">金香壇代禱・以小排為單位同心代禱</p></div></a><div class="top-acts">${modeBtn()}<button class="help" id="help" type="button" aria-label="使用教學">?</button></div></header>

    ${TAB === 'new' ? `<div class="dock"><div class="inner"><button class="btn send" id="send">${ICON_SEND}建立並傳到 LINE 群組</button></div></div>` : ''}`);
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    if (TAB === 'card' && CARD_MODE === 'edit' && b.dataset.tab !== 'card') return toast('請先儲存或取消編輯');
    if (b.dataset.tab === 'admin') { WSEL.clear(); WSELECTING = false; return go({ view: 'admin' }); }
    if (b.dataset.tab === 'mine') { WSEL.clear(); WSELECTING = false; return go({ view: 'mine' }); }

  });

  if ($('install-link')) $('install-link').onclick = startInstall;
  if (TAB === 'new') renderCompose(); else if (TAB === 'walls') renderWallsTab(); else renderCard();
}

/** 草稿 → 預覽用的代禱牆（還沒有名單） */
function draftWall(d, base) {
  const groups = d.groups.map(g => g.name.trim()).filter(Boolean);
  const old = {}; (base ? base.list : []).forEach(g => { old[g.name] = g.names; });
  const list = d.groups.filter(g => g.name.trim()).map(g => ({ name: g.name.trim(), names: old[g.from || g.name.trim()] || [] }));
  const filled = list.filter(g => g.names.length).length;
  return { ...d, id: base ? base.id : 'preview', groups, list, total: list.reduce((s, g) => s + g.names.length, 0), filled, unfilled: list.length - filled, open: base ? base.open : true };
}

let lastGroupInput = null;
function bindWallForm(d, base, onChange) {
  const pv = () => { $('pv').innerHTML = cardHtml(draftWall(d, base)); onChange && onChange(); };
  const counts = {}; (base ? base.list : []).forEach(g => { counts[g.name] = g.names.length; });
  const drawRows = focusLast => {
    $('group-rows').innerHTML = d.groups.map((g, i) => {
      const n = counts[g.from || ''] || 0;
      return `<div class="group-row"><input class="inp" data-g="${i}" maxlength="20" value="${esc(g.name)}" placeholder="排的名稱" aria-label="第 ${i + 1} 個排">${n ? `<span class="n">${n} 位</span>` : ''}<button class="icon-btn" type="button" data-gdel="${i}" aria-label="移除這個排">×</button></div>`;
    }).join('');
    document.querySelectorAll('[data-g]').forEach(inp => {
      inp.oninput = () => { d.groups[+inp.dataset.g].name = inp.value; pv(); };
      inp.onfocus = () => { lastGroupInput = inp; };
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); d.groups.splice(+inp.dataset.g + 1, 0, { name: '', from: '' }); drawRows(); const nx = document.querySelector(`[data-g="${+inp.dataset.g + 1}"]`); nx && nx.focus(); } };
    });
    document.querySelectorAll('[data-gdel]').forEach(b => b.onclick = () => {
      const i = +b.dataset.gdel, g = d.groups[i], n = counts[g.from || ''] || 0;
      const remove = () => { d.groups.splice(i, 1); if (!d.groups.length) d.groups.push({ name: '', from: '' }); drawRows(); pv(); };
      if (!n) return remove();
      if (!b.classList.contains('armed')) toast(`這個排有 ${n} 位，儲存後名單會一起刪除。再按一次 × 確定移除`);
      armThen(b, '!', remove);
    });
    if (focusLast) { const all = document.querySelectorAll('[data-g]'); all[all.length - 1].focus(); }
  };
  drawRows();
  $('w-title').oninput = e => { d.title = e.target.value; pv(); };
  $('w-tag').oninput = e => { d.tag = e.target.value; pv(); };
  $('w-verse').oninput = e => { d.verse = e.target.value; pv(); };
  $('w-desc').oninput = e => { d.desc = e.target.value; onChange && onChange(); };
  document.querySelectorAll('[data-verse]').forEach(b => b.onclick = () => { const i = +b.dataset.verse; d.verse = i < 0 ? '' : verseText(VERSES[i]); $('w-verse').value = d.verse; pv(); });
  $('g-add').onclick = () => { d.groups.push({ name: '', from: '' }); drawRows(true); };
  $('g-bulk').onclick = () => { $('bulk-box').hidden = !$('bulk-box').hidden; if (!$('bulk-box').hidden) $('bulk').focus(); };
  $('bulk-ok').onclick = () => {
    const add = String($('bulk').value).split(/\n+/).map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
    if (!add.length) return toast('請輸入排的名稱，一行一個');
    d.groups = d.groups.filter(g => g.name.trim() || g.from);
    add.forEach(name => { if (!d.groups.some(g => g.name.trim() === name)) d.groups.push({ name, from: '' }); });
    $('bulk').value = ''; $('bulk-box').hidden = true; drawRows(); pv(); toast(`已加入 ${add.length} 個排`);
  };
  $('g-home').onmousedown = e => e.preventDefault(); // 不要讓輸入框失去焦點
  $('g-home').onclick = () => {
    const inp = lastGroupInput && lastGroupInput.isConnected ? lastGroupInput : null;
    if (!inp) return toast('請先點一下要加上 🏠 的排名');
    const g = d.groups[+inp.dataset.g];
    g.name = g.name.startsWith('🏠') ? g.name.replace(/^🏠\s*/, '') : '🏠' + g.name;
    inp.value = g.name; inp.focus(); pv();
  };
  $('w-allow').onchange = e => { d.allowAdd = e.target.checked; onChange && onChange(); };
  document.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => { d.theme = b.dataset.theme; document.querySelectorAll('[data-theme]').forEach(x => x.setAttribute('aria-pressed', x === b)); pv(); });
}

const toPayload = d => ({ title: d.title.trim(), tag: d.tag.trim(), verse: d.verse.trim(), desc: d.desc.trim(), allowAdd: d.allowAdd, theme: d.theme,
  groups: d.groups.map(g => ({ name: g.name.replace(/\s+/g, ' ').trim(), from: g.from || '' })).filter(g => g.name) });
function formProblem(d) {
  const p = toPayload(d);
  if (!p.title) return ['請填寫代禱牆名稱', 'w-title'];
  if (!p.groups.length && !p.allowAdd) return ['請至少設定一個排，或開放成員自己新增排', 'group-rows'];
  const names = p.groups.map(g => g.name), dup = names.find((n, i) => names.indexOf(n) !== i);
  if (dup) return [`「${dup}」重複了`, 'group-rows'];
  return null;
}

async function createAndSend() {
  const bad = formProblem(draft);
  if (bad) { toast(bad[0]); const el = $(bad[1]); el && el.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  const btn = $('send'); btn.disabled = true; btn.textContent = '建立中…';
  try {
    const { wall } = await api('createWall', { wall: toPayload(draft) });
    WALLS.unshift({ ...wall, mine: true }); cacheSet('platform', { me: ME, walls: WALLS });
    if (!JOINED.some(x => x.id === wall.id)) JOINED.unshift({ ...wall, mine: true });
    draft = blankDraft(); try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    TAB = 'walls'; go({ view: 'detail', id: wall.id });
    await share(wall);
  } catch (e) { toast(e.message); btn.disabled = false; btn.innerHTML = `${ICON_SEND}建立並傳到 LINE 群組`; }
}

function updateLocal(wall) {

  { sel: '.pcard .grid', title: '2. 點名字代禱', text: '為誰禱告過就點一下，石榴籽會變紅，每天重新開始。名字旁的信封可以寫一封信給他，存好後傳到他的 LINE。' },
  { sel: '#card-edit', title: '3. 編輯名單', text: '加名字、改類別都在這裡。也可以「貼上名字」，或用名單代碼和金香壇代禱卡互通。' },
  { sel: '#card-towall', title: '4. 放上代禱牆', text: '挑幾位福音朋友放上小區、小排的團體代禱牆，大家一起同心代禱。在代禱牆填的名字，也可以同時加回你的代禱卡。' },
];
const CARD_TOUR_KEY = 'pw.tour.card';
const tourSeen = () => { try { return parseInt(localStorage.getItem(TOUR_KEY) || '0', 10) || 0; } catch (e) { return TOUR_VERSION; } };
function maybeStartTour() {
  if (TAB === 'card') {
    let seenCard = 0; try { seenCard = +(localStorage.getItem(CARD_TOUR_KEY) || 0); } catch (e) { seenCard = 1; }
    if (!seenCard && CARD && $('card-edit')) setTimeout(() => startTour(CARD_TOUR, 'card'), 500);
    return;
  }
  const seen = tourSeen();
  if (seen >= TOUR_VERSION || TAB !== 'new') return;
  const steps = seen ? TOUR_STEPS.filter(s => (s.since || 1) > seen) : TOUR_STEPS;
  if (steps.length) setTimeout(() => startTour(steps), 500);
}
let TOUR = null;
function startTour(steps, tab = steps === CARD_TOUR ? 'card' : 'new') {
  if (TAB !== tab || ROUTE.view !== 'tabs') { TAB = tab; go({ view: 'tabs' }); }
  endTour(true);
  TOUR = { steps, i: 0, tab };
  document.body.insertAdjacentHTML('beforeend', `<div class="tour-mask" id="tour-mask"></div><div class="tour-hole" id="tour-hole"></div>
    <div class="tour-tip" id="tour-tip" role="dialog" aria-modal="true" aria-labelledby="tour-h"><div class="k" id="tour-k"></div><h3 id="tour-h"></h3><p id="tour-p"></p>
    <div class="acts"><button class="link" id="tour-skip">略過</button><div><button class="btn small ghost" id="tour-prev">上一步</button><button class="btn small send" id="tour-next">下一步</button></div></div></div>`);
  $('tour-skip').onclick = () => endTour();
  $('tour-mask').onclick = () => endTour();
  $('tour-prev').onclick = () => tourGo(TOUR.i - 1);
  $('tour-next').onclick = () => TOUR.i >= TOUR.steps.length - 1 ? endTour() : tourGo(TOUR.i + 1);
  addEventListener('keydown', tourKey);
  tourGo(0);
}
function tourKey(e) { if (TOUR && e.key === 'Escape') endTour(); }
function tourGo(i) {
  if (!TOUR || i < 0) return;
  TOUR.i = i;
  const s = TOUR.steps[i], el = document.querySelector(s.sel);
  $('tour-k').textContent = `使用教學 ${i + 1}／${TOUR.steps.length}`;
  $('tour-h').textContent = s.title; $('tour-p').textContent = s.text;
  $('tour-prev').hidden = i === 0;
  $('tour-next').textContent = i === TOUR.steps.length - 1 ? '開始使用' : '下一步';
  // 直接捲到目標（不用平滑捲動，手機上平滑捲動時框框會對不準），目標放在畫面上方約四分之一，下面留給說明框
  if (el && !el.closest('.dock')) { const r = el.getBoundingClientRect(); window.scrollTo({ top: Math.max(0, scrollY + r.top - innerHeight * 0.2), behavior: 'auto' }); }
  placeTour(); requestAnimationFrame(placeTour); [150, 400, 800].forEach(ms => setTimeout(placeTour, ms));
  $('tour-next').focus();
}
function placeTour() {
  if (!TOUR) return;
  const el = document.querySelector(TOUR.steps[TOUR.i].sel), hole = $('tour-hole'), tip = $('tour-tip');
  if (!el) { hole.style.cssText = 'left:50%;top:50%;width:0;height:0'; tip.style.top = '30%'; return; }
  const r = el.getBoundingClientRect(), pad = 6;
  Object.assign(hole.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
  const below = r.bottom + 16, th = tip.offsetHeight;
  // 放得下就放在目標下面，否則放上面；兩邊都放不下就貼齊畫面底部
  tip.style.top = (below + th < innerHeight - 10 ? below : r.top - th - 16 >= 10 ? r.top - th - 16 : Math.max(10, innerHeight - th - 10)) + 'px';
}
addEventListener('resize', placeTour);
addEventListener('scroll', () => { if (TOUR) placeTour(); }, { passive: true }); // 捲動時框框跟著目標
function endTour(silent) {
  ['tour-mask', 'tour-hole', 'tour-tip'].forEach(id => { const el = $(id); el && el.remove(); });
  removeEventListener('keydown', tourKey);
  if (TOUR && !silent) { try { localStorage.setItem(TOUR.tab === 'card' ? CARD_TOUR_KEY : TOUR_KEY, TOUR.tab === 'card' ? '1' : String(TOUR_VERSION)); } catch (e) {} window.scrollTo({ top: 0, behavior: 'smooth' }); }
  TOUR = null;
}

main();
</script>
</body>
</html>
