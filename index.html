    const b = $('d-toggle'); b.disabled = true;
    try { const r = await api('setOpen', { wallId: w.id, open: !w.open }); updateLocal(r.wall); toast(r.wall.open ? '已重新開放填寫' : '已停止填寫'); drawDetail(r.wall); }
    catch (e) { toast(e.message); b.disabled = false; }
  };
  bindRemove($('d-list'), w.id, wall => { updateLocal(wall); const y = window.scrollY; drawDetail(wall); window.scrollTo(0, y); });
  $('d-del').onclick = () => armThen($('d-del'), '確定刪除？再按一次', async () => {
    $('d-del').disabled = true;
    try { await api('deleteWall', { wallId: w.id }); WALLS = WALLS.filter(x => x.id !== w.id); cacheSet('platform', { me: ME, walls: WALLS }); toast('已刪除'); TAB = 'walls'; go({ view: 'tabs' }); }
    catch (e) { toast(e.message); $('d-del').disabled = false; }
  });
}

function updateLocal(wall) {
  const i = WALLS.findIndex(x => x.id === wall.id);
  if (i >= 0) WALLS[i] = { ...WALLS[i], ...wall }; else WALLS.unshift(wall);
  cacheSet('platform', { me: ME, walls: WALLS });
}

function renderEdit(id) {
  const w = WALLS.find(x => x.id === id);
  if (!w) return go({ view: 'tabs' });
  editDraft = { title: w.title, tag: w.tag, verse: w.verse, desc: w.desc, allowAdd: w.allowAdd, theme: w.theme,
    groups: w.list.map(g => ({ name: g.name, from: g.name })) };
  if (!editDraft.groups.length) editDraft.groups.push({ name: '', from: '' });
  view(`<div class="subbar"><button class="back" id="back">‹ 取消</button><h1>編輯代禱牆</h1><span></span></div>
    ${wallForm(editDraft, w)}
    <div class="dock"><div class="inner"><button class="btn send" id="save">儲存</button></div></div>`);
  bindWallForm(editDraft, w);
  $('back').onclick = () => go({ view: 'detail', id });
  $('save').onclick = async () => {
    const bad = formProblem(editDraft);
    if (bad) return toast(bad[0]);
    const btn = $('save'); btn.disabled = true; btn.textContent = '儲存中…';
    try { const r = await api('updateWall', { wallId: id, wall: toPayload(editDraft) }); updateLocal(r.wall); toast('已儲存。要讓群組看到新內容，請再發送一次圖卡'); go({ view: 'detail', id }); }
    catch (e) { toast(e.message); btn.disabled = false; btn.textContent = '儲存'; }
  };
}

/* ================= 我的個人資料 ================= */
async function myDataFlow() {
  resetTheme();
  view(loading());
  const d = await api('myData');
  const back = `<button class="btn ghost" style="margin-top:12px" onclick="location.href=location.pathname${DEMO ? "+'?demo'" : ''}">回到平台</button>`;
  view(`<section class="solo"><div class="msg-card" style="text-align:left">
      <h1>我的個人資料</h1>
      <p class="muted small">系統只記錄你的 LINE 名稱、LINE 內部識別碼，以及你填過的名字。</p>
      <p><b>LINE 名稱：</b>${esc(d.displayName)}</p>
      <p style="margin-bottom:0"><b>我填過的名字（${d.entries.length}）</b></p>
      ${d.entries.length ? `<ul class="mylist">${d.entries.map(e => `<li>${esc(e.name)}<br><span class="muted small">${esc(e.wall)}・${esc(e.group)}・${esc(e.time)}</span></li>`).join('')}</ul>` : '<p class="muted">沒有。</p>'}
      <p><b>我的代禱卡：</b>${d.cardCount || 0} 個名字（只有你看得到）</p>
      ${d.walls.length ? `<p class="muted small">你建立了 ${d.walls.length} 面代禱牆（${esc(d.walls.join('、'))}），請在平台「已建立」裡管理或刪除。</p>` : ''}
      <button class="btn danger" id="del-me" style="margin-top:10px">刪除我填過的名字與登入紀錄</button>
    </div>${back}</section>`);
  $('del-me').onclick = () => armThen($('del-me'), '確定刪除？再按一次', async () => {
    $('del-me').disabled = true;
    try { const r = await api('deleteMyData'); setSession(null); view(`<section class="solo"><div class="msg-card"><div style="font-size:34px">✓</div><h1>已刪除</h1><p>已移除你填過的 ${r.entries} 個名字和登入紀錄。</p></div>${back}</section>`); }
    catch (e) { toast(e.message); $('del-me').disabled = false; }
  });
}

/* ================= 安裝到手機桌面（PWA） ================= */
let installPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function startInstall() {
  if (inClient()) { liff.openWindow({ url: `${location.origin}${location.pathname}?install=1`, external: true }); return; }
  installFlow();
}
function installFlow() {
  document.title = '安裝「代禱牆」';
  const steps = isIOS()
    ? `<ol class="install-steps"><li>用 <b>Safari</b> 開啟這個頁面</li><li>點下方的「分享」按鈕</li><li>往下滑，點「<b>加入主畫面</b>」</li><li>按右上角「新增」</li></ol>`
    : `<ol class="install-steps"><li>點上面的「安裝到手機桌面」</li><li>如果沒有反應：點瀏覽器右上角「⋮」選單</li><li>選「<b>安裝應用程式</b>」或「<b>加到主畫面</b>」</li></ol>`;
  view(`<section class="solo"><div class="msg-card">
    <img src="icons/icon-192.png" alt="" width="88" height="88" style="border-radius:22px">
    <h1>代禱牆</h1>
    <p class="muted">把「建立代禱牆圖卡」平台放到手機桌面，像 App 一樣一點就開。</p>
    ${isStandalone() ? '<p class="posted">已經安裝好了，從桌面的圖示打開即可。</p>' : `<button class="btn send" id="do-install" ${isIOS() ? 'hidden' : ''}>安裝到手機桌面</button>${steps}`}
    <p class="muted small">第一次從桌面打開時，會請你用 LINE 帳號登入一次。</p>
    <button class="btn ghost" id="go-platform" style="margin-top:10px">前往平台</button>
  </div></section>`);
  const btn = $('do-install');
  if (btn) btn.onclick = async () => {
    if (!installPrompt) { toast('請依照下面的步驟，從瀏覽器選單安裝'); return; }
    installPrompt.prompt();
    const r = await installPrompt.userChoice.catch(() => null);
    installPrompt = null;
    toast(r && r.outcome === 'accepted' ? '安裝完成，可以從桌面打開了' : '已取消安裝');
  };
  $('go-platform').onclick = () => { location.href = `${location.origin}${location.pathname}?pwa=1`; };
}
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

/* ================= 使用教學（第一次使用時出現；新功能用 since 標記） ================= */
const TOUR_KEY = 'pw.tour';
const TOUR_VERSION = 1;
const TOUR_STEPS = [
  { sel: '#f-title', title: '1. 取一個名字', text: '例如「小區福音代禱牆」，再以小區下面的各小排為單位填名單。標語和經文會出現在圖卡最上面，可以改也可以留白。' },
  { sel: '#f-groups', title: '2. 設定排的清單', text: '成員打開代禱牆時，先選自己的排再填名字。名單很長可以用「一次貼上多個」。' },
  { sel: '#f-allow', title: '3. 讓成員自己加排', text: '打開後，排不在清單上的人可以自己新增，不用來問你。' },
  { sel: '#f-theme', title: '4. 挑一個色調', text: '上面的預覽會跟著變，就是群組裡看到的樣子。' },
  { sel: '#send', title: '5. 發送到群組', text: '選好群組就發出去。大家填完名字，可以選擇把最新的代禱牆貼回群組。之後在「已建立」裡管理名單。' },
];
const CARD_TOUR = [
  { sel: '.days', title: '1. 一週七天', text: '每天為一類人禱告：主日家人、週一親戚、週二好友……今天會有一個小金點。' },
  { sel: '.pcard .grid', title: '2. 點名字代禱', text: '為誰禱告過就點一下，石榴籽會變紅。每天重新開始。' },
  { sel: '#card-edit', title: '3. 編輯名單', text: '加名字、改類別都在這裡。也可以「貼上名字」，或用名單代碼和金香壇代禱卡互通。' },
  { sel: '#card-towall', title: '4. 放上代禱牆', text: '挑幾位福音朋友放上小區、小排的團體代禱牆，大家一起同心代禱。在代禱牆填的名字，也可以同時加回你的代禱卡。' },
];
const CARD_TOUR_KEY = 'pw.tour.card';
const tourSeen = () => { try { return parseInt(localStorage.getItem(TOUR_KEY) || '0', 10) || 0; } catch (e) { return TOUR_VERSION; } };
function maybeStartTour() {
  if (TAB === 'card') {
    let seenCard = 0; try { seenCard = +(localStorage.getItem(CARD_TOUR_KEY) || 0); } catch (e) { seenCard = 1; }
    if (!seenCard && CARD && $('card-edit')) setTimeout(() => startTour(CARD_TOUR, 'card'), 500);
    return;
  }
  const seen = tourSeen();
  if (seen >= TOUR_VERSION || TAB !== 'new') return;
  const steps = seen ? TOUR_STEPS.filter(s => (s.since || 1) > seen) : TOUR_STEPS;
  if (steps.length) setTimeout(() => startTour(steps), 500);
}
let TOUR = null;
function startTour(steps, tab = steps === CARD_TOUR ? 'card' : 'new') {
  if (TAB !== tab || ROUTE.view !== 'tabs') { TAB = tab; go({ view: 'tabs' }); }
  endTour(true);
  TOUR = { steps, i: 0, tab };
  document.body.insertAdjacentHTML('beforeend', `<div class="tour-mask" id="tour-mask"></div><div class="tour-hole" id="tour-hole"></div>
    <div class="tour-tip" id="tour-tip" role="dialog" aria-modal="true" aria-labelledby="tour-h"><div class="k" id="tour-k"></div><h3 id="tour-h"></h3><p id="tour-p"></p>
    <div class="acts"><button class="link" id="tour-skip">略過</button><div><button class="btn small ghost" id="tour-prev">上一步</button><button class="btn small send" id="tour-next">下一步</button></div></div></div>`);
  $('tour-skip').onclick = () => endTour();
  $('tour-mask').onclick = () => endTour();
  $('tour-prev').onclick = () => tourGo(TOUR.i - 1);
  $('tour-next').onclick = () => TOUR.i >= TOUR.steps.length - 1 ? endTour() : tourGo(TOUR.i + 1);
  addEventListener('keydown', tourKey);
  tourGo(0);
}
function tourKey(e) { if (TOUR && e.key === 'Escape') endTour(); }
function tourGo(i) {
  if (!TOUR || i < 0) return;
  TOUR.i = i;
  const s = TOUR.steps[i], el = document.querySelector(s.sel);
  $('tour-k').textContent = `使用教學 ${i + 1}／${TOUR.steps.length}`;
  $('tour-h').textContent = s.title; $('tour-p').textContent = s.text;
  $('tour-prev').hidden = i === 0;
  $('tour-next').textContent = i === TOUR.steps.length - 1 ? '開始使用' : '下一步';
  if (el && !el.closest('.dock')) el.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  setTimeout(placeTour, 350);
  $('tour-next').focus();
}
function placeTour() {
  if (!TOUR) return;
  const el = document.querySelector(TOUR.steps[TOUR.i].sel), hole = $('tour-hole'), tip = $('tour-tip');
  if (!el) { hole.style.cssText = 'left:50%;top:50%;width:0;height:0'; tip.style.top = '30%'; return; }
  const r = el.getBoundingClientRect(), pad = 6;
  Object.assign(hole.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
  const below = r.bottom + 16, th = tip.offsetHeight;
  tip.style.top = (below + th < innerHeight - 10 ? below : Math.max(10, r.top - th - 16)) + 'px';
}
addEventListener('resize', placeTour);
function endTour(silent) {
  ['tour-mask', 'tour-hole', 'tour-tip'].forEach(id => { const el = $(id); el && el.remove(); });
  removeEventListener('keydown', tourKey);
  if (TOUR && !silent) { try { localStorage.setItem(TOUR.tab === 'card' ? CARD_TOUR_KEY : TOUR_KEY, TOUR.tab === 'card' ? '1' : String(TOUR_VERSION)); } catch (e) {} window.scrollTo({ top: 0, behavior: 'smooth' }); }
  TOUR = null;
}

main();
</script>
