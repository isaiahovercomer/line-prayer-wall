<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F1E4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="代禱牆">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>LINE代禱牆建立平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://api.line.me" crossorigin>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    /* 延續「金香壇代禱卡」：米白紙色、石榴紅、楷體、石榴籽 */
    --paper: #F2F1E4;       /* 頁面底色 */
    --sheet: #FBFAF2;       /* 卡片紙 */
    --ink: #2E322F;
    --muted: #767B73;
    --line: #A8ACA4;        /* 外框 */
    --rule: #D9D8CC;        /* 內部分隔 */
    --olive: #B6A359; --olive-ink: #8A7A2E; --leaf: #8DB38A;
    --line-green: #06C755; --share-ink: #0B8F45;
    --stamp: #A12A3C;
    --kai: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", serif;
    --sans: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    /* 每面代禱牆的色調（預設石榴紅） */
    --bar: #A12A3C; --g2: #6F1A28; --pill: #E7C9CD;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--olive); outline-offset: 2px; }
  [hidden] { display: none !important; }
  #app { max-width: 560px; margin: 0 auto; padding: 20px 16px calc(120px + env(safe-area-inset-bottom)); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .kai { font-family: var(--kai); }

  /* ---------- 平台頂部 ---------- */
  header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; padding-top: env(safe-area-inset-top); }
  header.top .brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; border-radius: 12px; }
  header.top .logo { width: 48px; height: 48px; flex: none; display: block; }
  header.top .logo svg { width: 100%; height: 100%; display: block; }
  header.top h1 { font-family: var(--kai); font-weight: 700; font-size: 1.5rem; letter-spacing: .12em; margin: 0; line-height: 1.2; }
  header.top .sub { margin: 2px 0 0; color: var(--muted); font-size: .85rem; letter-spacing: .04em; }
  .help { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--muted); font-weight: 700; cursor: pointer; }
  .demo-note { background: #EDE6C8; color: #6C5F22; font-size: 13px; padding: 8px 12px; border-radius: 12px; margin: 0 0 10px; }

  .tabs { display: flex; gap: 22px; border-bottom: 1.5px solid var(--line); margin: 4px 0 18px; }
  .tabs button { background: none; border: 0; padding: 10px 0; font-family: var(--kai); font-size: 17px; letter-spacing: .06em; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1.5px; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--g2); border-bottom-color: var(--bar); font-weight: 700; }
  .tabs .n { font-family: var(--sans); font-size: 12px; margin-left: 4px; }
  .subbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 0 14px; }
  .back { background: none; border: 0; padding: 6px 0; font-size: 16px; color: var(--muted); cursor: pointer; }
  .subbar h1 { font-family: var(--kai); font-size: 19px; letter-spacing: .08em; margin: 0; color: var(--g2); }

  /* ---------- 紙卡、表單 ---------- */
  .card { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 26px; padding: 22px 18px 20px; margin: 0 0 16px; position: relative; overflow: hidden; }
  .card.dot::before { content: ""; position: absolute; right: -26px; top: -26px; width: 96px; height: 96px; border-radius: 50%; background: var(--bar); opacity: .12; }
  .card > h2 { position: relative; font-family: var(--kai); font-weight: 700; font-size: 1.45rem; letter-spacing: .1em; color: var(--g2); margin: 0 0 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card > h2 small { font-family: var(--sans); font-size: 13px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
  .step { font-size: 15px; font-weight: 700; margin: 4px 0 10px; color: var(--ink); }
  .step b { font-family: var(--kai); color: var(--bar); margin-right: 4px; }
  .field { display: block; margin-bottom: 16px; }
  .field > span { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .field > span em { font-style: normal; font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .field input, .field textarea, .inp { width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; font-size: 16px; min-height: 48px; }
  .field textarea, textarea.inp { min-height: 96px; resize: vertical; line-height: 1.7; }
  #names { font-family: var(--kai); font-size: 18px; }
  .field input:focus, .field textarea:focus, .inp:focus { border-color: var(--bar); outline: none; box-shadow: 0 0 0 3px var(--pill); }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 2px 0; line-height: 1.6; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .presets button { background: transparent; border: 1px solid var(--olive); border-radius: 999px; padding: 3px 12px; font-size: 13px; color: var(--olive-ink); cursor: pointer; }

  .btn { appearance: none; display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; border: 1.5px solid var(--bar); border-radius: 999px; padding: 12px 18px; min-height: 48px; font-size: 16px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; background: transparent; color: var(--bar); letter-spacing: .04em; }
  .btn.send { background: var(--bar); color: #fff; box-shadow: 0 6px 16px -8px var(--g2); }
  .btn.send:active { background: var(--g2); }
  .btn.line { background: var(--line-green); border-color: var(--line-green); color: #fff; }
  .btn.share { border-color: var(--line-green); color: var(--share-ink); background: transparent; }
  .btn.plain { background: transparent; }
  .btn.ghost { border-color: var(--line); color: var(--muted); font-weight: 500; }
  .btn.code { border-color: var(--olive); color: var(--olive-ink); font-weight: 500; }
  .btn.danger { border-color: rgba(161,42,60,.45); color: var(--stamp); font-weight: 500; }
  .btn.danger.armed { background: var(--stamp); color: #fff; border-color: var(--stamp); }
  .btn.small { display: inline-flex; width: auto; padding: 6px 14px; min-height: 38px; font-size: 14px; font-weight: 500; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .btn-grid .btn { font-size: 15px; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--paper) 70%, rgba(242,241,228,0)); z-index: 5; }
  .dock .inner { max-width: 528px; margin: 0 auto; }

  /* 開關 */
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 4px 0; }
  .switch-row b { display: block; font-size: 15px; }
  .switch-row small { display: block; color: var(--muted); font-size: 13px; }
  .switch { position: relative; flex: none; width: 52px; height: 30px; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: #C9C8BC; transition: background .2s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .switch input:checked + span { background: var(--line-green); }
  .switch input:checked + span::after { transform: translateX(22px); }
  .switch input:focus-visible + span { outline: 3px solid var(--olive); outline-offset: 2px; }

  /* ---------- 代禱牆頁首（石榴插畫＋題字） ---------- */
  .hero { position: relative; display: grid; grid-template-columns: 46% 1fr; align-items: center; min-height: 190px; border-radius: 26px; overflow: hidden; background: var(--sheet); border: 1.5px solid var(--line); box-shadow: 0 6px 18px rgba(60,20,25,.12); margin-bottom: 16px; }
  .hero .art { align-self: stretch; position: relative; }
  .hero .art svg { position: absolute; left: -18%; top: 50%; width: 125%; transform: translateY(-50%); }
  .hero .label { position: relative; margin: 18px 14px 18px 0; padding: 14px 12px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); text-align: center; }
  .hero .tag { font-size: 12px; color: var(--bar); border: 1px solid var(--bar); border-radius: 999px; padding: 0 9px; display: inline-block; letter-spacing: .1em; }
  .hero h1 { font-family: var(--kai); font-weight: 700; font-size: 1.75rem; line-height: 1.3; letter-spacing: .14em; margin: 6px 0 0; color: var(--ink); word-break: break-word; }
  .intro { margin: 0 4px 14px; color: var(--muted); font-size: 15px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--sheet); margin-bottom: 16px; }
  .stats div { padding: 10px 4px 8px; text-align: center; }
  .stats div + div { border-left: 1px solid var(--line); }
  .stats b { display: block; font-family: var(--kai); font-size: 30px; line-height: 1.15; color: var(--g2); }
  .stats span { font-size: 12px; color: var(--muted); }
  .seeds { display: flex; flex-wrap: wrap; gap: 5px; margin: -4px 4px 16px; }
  .seed { width: 9px; height: 13px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: var(--pill); }
  .seed.f { background: var(--bar); }
  .closed-note { background: #EDE6C8; color: #6C5F22; border-radius: 14px; padding: 10px 14px; font-size: 14px; margin: 0 0 16px; }
  .verse { margin: 26px 4px 0; font-family: var(--kai); color: var(--muted); font-size: 1rem; line-height: 1.9; letter-spacing: .05em; border-left: 3px solid var(--olive); padding-left: 12px; }
  .verse cite { display: block; font-style: normal; font-size: .85rem; }

  /* 選排 */
  .group-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .group-pick button { display: flex; align-items: center; justify-content: space-between; gap: 6px; text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; min-height: 52px; font-family: var(--kai); font-size: 16px; cursor: pointer; line-height: 1.35; }
  .group-pick button .c { flex: none; font-family: var(--sans); font-size: 12px; color: var(--muted); }
  .group-pick button[aria-pressed="true"] { background: var(--bar); border-color: var(--bar); color: #fff; }
  .group-pick button[aria-pressed="true"] .c { color: rgba(255,255,255,.85); }
  .group-pick button.add { justify-content: center; border-style: dashed; color: var(--muted); font-family: var(--sans); font-size: 14px; }
  .new-group { display: flex; gap: 8px; margin-top: 10px; }
  .new-group .inp { min-height: 44px; }

  /* 各排名單 */
  .wall-group { position: relative; padding: 12px 0; border-top: 1px dashed var(--rule); }
  .wall-group:first-of-type { border-top: 0; padding-top: 0; }
  .wall-group h3 { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 8px; font-family: var(--kai); font-size: 18px; letter-spacing: .06em; color: var(--g2); }
  .wall-group h3 small { font-family: var(--sans); color: var(--muted); font-weight: 400; font-size: 13px; letter-spacing: 0; }
  .wall-group.empty h3 { color: var(--muted); font-weight: 400; margin: 0; }
  .names { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .name { position: relative; display: flex; align-items: center; min-height: 46px; padding: 6px 6px 6px 30px; font-family: var(--kai); font-size: 17px; border-bottom: 1px solid var(--rule); }
  .name:nth-child(odd) { border-right: 1px solid var(--rule); }
  .name:nth-last-child(1), .name:nth-last-child(2):nth-child(odd) { border-bottom: 0; }
  .name::before { content: ""; position: absolute; left: 11px; top: 50%; width: 10px; height: 14px; margin-top: -7px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: var(--bar); }
  .name span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .name.fresh { animation: pop .8s ease; }
  @keyframes pop { 0% { background: var(--pill); } 100% { background: transparent; } }
  .name button { flex: none; border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; line-height: 1; cursor: pointer; }
  .name button:hover { background: rgba(0,0,0,.05); color: var(--stamp); }
  .name button.armed { background: var(--stamp); color: #fff; font-size: 12px; width: auto; padding: 0 8px; border-radius: 999px; }
  .posted { color: var(--share-ink); font-size: 14px; margin: 10px 0 0; }
  .posted.warn { color: var(--stamp); }
  .page-foot { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 18px; margin: 22px 0 0; }
  .link { background: none; border: 0; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 0; }

  /* ---------- 個人代禱卡（同金香壇代禱卡） ---------- */
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 16px; }
  .day { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 12px; padding: 6px 0 5px; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; min-height: 52px; }
  .day .wd { font-family: var(--kai); font-size: .95rem; line-height: 1.3; }
  .day .ct { font-size: .66rem; color: var(--muted); line-height: 1.3; white-space: nowrap; }
  .day.today::after { content: ""; position: absolute; top: -4px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--olive); border: 2px solid var(--paper); }
  .day.on { background: var(--bar); border-color: var(--bar); color: #fff; }
  .day.on .ct { color: rgba(255,255,255,.85); }
  .pcard { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 26px; padding: 22px 18px 18px; position: relative; overflow: hidden; }
  .pcard::before { content: ""; position: absolute; right: -26px; top: -26px; width: 96px; height: 96px; border-radius: 50%; background: var(--bar); opacity: .12; }
  .pcard .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; position: relative; }
  .pcard .head .wd { font-size: .95rem; color: var(--muted); letter-spacing: .08em; }
  .pcard .head .tag { font-size: .75rem; color: var(--bar); border: 1px solid var(--bar); border-radius: 999px; padding: 0 8px; }
  .pcard .head h2 { font-family: var(--kai); font-weight: 700; font-size: 2.6rem; line-height: 1.1; margin: 4px 0 0; width: 100%; letter-spacing: .14em; color: var(--g2); }
  .pcard .seeds { margin: 14px 0 4px; min-height: 14px; }
  .count { margin: 0 0 14px; color: var(--muted); font-size: .85rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; }
  .cell, .cell-in { appearance: none; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-family: var(--kai); font-size: 1.15rem; min-height: 54px; padding: 8px 10px 8px 30px; text-align: left; position: relative; width: 100%; border-radius: 0; display: flex; align-items: center; gap: 6px; }
  .grid > :nth-child(2n) { border-right: 0; }
  .grid > :nth-last-child(-n+2) { border-bottom: 0; }
  .cell { cursor: pointer; }
  .cell > span:first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .cell::before { content: ""; position: absolute; left: 11px; top: 50%; width: 10px; height: 14px; margin-top: -7px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; border: 1.5px solid var(--line); }
  .cell.done::before { background: var(--bar); border-color: var(--bar); }
  .cell.done { color: var(--muted); }
  .cell:disabled { cursor: default; }
  .cell:disabled::before { border-style: dashed; opacity: .5; }
  .cell-in { background: var(--paper); outline: none; padding-left: 12px; }
  .cell-in:focus { background: #fff; box-shadow: inset 0 0 0 2px var(--pill); }
  .cell-in::placeholder { color: var(--line); }
  .wb { flex: none; font-family: var(--sans); font-size: 11px; color: var(--olive-ink); border: 1px solid var(--olive); border-radius: 999px; padding: 0 6px; line-height: 1.5; }
  .empty { margin: 14px 2px 0; color: var(--muted); font-size: .9rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; position: relative; }
  .actions .btn { width: auto; flex: 0 0 auto; padding: 10px 18px; min-height: 44px; font-size: .95rem; font-weight: 500; }
  .actions .btn.send, .actions .btn.line { font-weight: 700; }
  .actions.tools { margin-top: 8px; }
  .actions.tools .btn { font-size: .85rem; padding: 7px 13px; min-height: 38px; }
  .btn.edit { border-color: var(--bar); color: var(--bar); }
  .cat-edit { margin: 12px 0 10px; }
  .cat-edit input { font-family: var(--kai); font-size: 18px; }
  .paste { margin-top: 14px; border: 1px dashed var(--olive); border-radius: 16px; padding: 12px 14px; }
  .paste-title { font-weight: 700; margin: 0 0 4px; color: var(--olive-ink); }
  .paste-sub { margin: 0 0 8px; color: var(--muted); font-size: .85rem; line-height: 1.55; }
  .paste textarea { min-height: 140px; }
  .paste-day { margin: 12px 0 6px; font-weight: 700; color: var(--g2); font-size: .95rem; font-family: var(--kai); letter-spacing: .06em; }
  .import-note { background: var(--sheet); border: 1.5px dashed var(--olive); border-radius: 18px; padding: 12px 14px; margin-bottom: 14px; }
  .import-note p { margin: 0; font-size: 14px; }
  .import-note .actions { margin-top: 10px; }
  .pick-names { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick-names button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 14px; font-family: var(--kai); font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .pick-names button small { font-family: var(--sans); font-size: 10px; color: var(--olive-ink); }
  .pick-names button[aria-pressed="true"] { background: var(--bar); border-color: var(--bar); color: #fff; }
  .pick-names button[aria-pressed="true"] small { color: rgba(255,255,255,.85); }
  .wall-pick { display: grid; gap: 8px; }
  .wall-pick button { text-align: left; border: 1px solid var(--line); background: transparent; border-radius: 16px; padding: 10px 14px 10px 34px; cursor: pointer; position: relative; }
  .wall-pick button::before { content: ""; position: absolute; left: 13px; top: 15px; width: 10px; height: 14px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; border: 1.5px solid var(--bar); }
  .wall-pick button b { display: block; font-family: var(--kai); font-size: 17px; color: var(--g2); }
  .wall-pick button span { font-size: 12px; color: var(--muted); }
  .wall-pick button[aria-pressed="true"] { border-color: var(--bar); box-shadow: 0 0 0 2px var(--pill); }
  .wall-pick button[aria-pressed="true"]::before { background: var(--bar); }
  h2.sec { font-family: var(--kai); font-size: 1.2rem; letter-spacing: .08em; color: var(--g2); margin: 6px 0 10px; display: flex; align-items: baseline; gap: 8px; }
  h2.sec small { font-family: var(--sans); font-size: 12px; color: var(--muted); }
  .sec-empty { margin: -4px 4px 18px; }
  .day-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .day-pick button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-family: var(--kai); font-size: 15px; cursor: pointer; }
  .day-pick button[aria-pressed="true"] { background: var(--bar); border-color: var(--bar); color: #fff; }

  /* ---------- 圖卡預覽（模擬群組裡的 LINE 圖卡） ---------- */
  .pv-panel { background: rgba(182,163,89,.1); border: 1.5px dashed var(--olive); border-radius: 26px; padding: 12px 12px 16px; margin-bottom: 14px; }
  .pv-label { display: flex; align-items: baseline; gap: 10px; margin: 0 4px 10px; }
  .pv-label .t { background: var(--olive); color: #fff; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; letter-spacing: .06em; }

<script>
/* ================= 設定 ================= */

}

/** 按兩下才執行（刪除等動作） */
function armThen(btn, label, fn) {
  if (!btn.classList.contains('armed')) {
    const old = btn.innerHTML;
    btn.classList.add('armed'); btn.textContent = label;
    setTimeout(() => { if (btn.isConnected && !btn.disabled && btn.classList.contains('armed')) { btn.classList.remove('armed'); btn.innerHTML = old; } }, 4000);

  btn.classList.remove('armed'); fn();
}

/* ================= 代禱牆色調 ================= */
const THEMES = {
  pom:   { name: '石榴紅', bar: '#A12A3C', g2: '#6F1A28', pill: '#E7C9CD' },
  olive: { name: '橄欖金', bar: '#8A7A2E', g2: '#5E5320', pill: '#EDE4C4' },
  leaf:  { name: '葉綠',   bar: '#4E7F4B', g2: '#2F5530', pill: '#D6E6D3' },
  sky:   { name: '天藍',   bar: '#4F7FA3', g2: '#2E5573', pill: '#D5E3EE' },
};
const themeOf = w => THEMES[w && w.theme] || THEMES.pom;
const themeVars = t => `--bar:${t.bar};--g2:${t.g2};--pill:${t.pill}`;
function applyTheme(w) { const t = themeOf(w); ['bar', 'g2', 'pill'].forEach(k => document.documentElement.style.setProperty('--' + k, t[k])); }
function resetTheme() { ['bar', 'g2', 'pill'].forEach(k => document.documentElement.style.removeProperty('--' + k)); }
const SITE = 'https://isaiahovercomer.github.io/line-prayer-wall/';

/** 剖開的石榴（顏色跟著代禱牆色調） */
const POM_SVG = (() => {
  const seeds = [];
  [[0, 1], [15, 6], [30, 12], [45, 18], [58, 23]].forEach(([r, n], ring) => {
    for (let i = 0; i < n; i++) {
      if (ring > 1 && (i * 3 + ring) % 8 === 2) continue; // 留白＝白色隔膜
      const a = (i / n) * Math.PI * 2 + ring * 0.45, x = 100 + r * Math.cos(a), y = 112 + r * Math.sin(a) * 0.96;
      const deep = (i + ring) % 3 === 0;
      seeds.push(`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="6.4" ry="8.6" transform="rotate(${(a * 57.3 + 90).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" style="fill:var(--${deep ? 'g2' : 'bar'})"/>`
        + `<ellipse cx="${(x - 1.8).toFixed(1)}" cy="${(y - 2.6).toFixed(1)}" rx="1.6" ry="2.4" fill="#fff" opacity=".45"/>`);
    }
  });
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M128 40c16-24 44-30 58-26-6 20-28 40-58 26z" fill="#8DB38A"/><path d="M128 40c18-10 34-18 52-22" stroke="#6E9A6B" stroke-width="2" fill="none"/>
    <path d="M84 36l6-20 10 12 10-12 6 20z" style="fill:var(--g2)"/>
    <circle cx="100" cy="112" r="82" style="fill:var(--pill);stroke:var(--bar)" stroke-width="6"/>
    <circle cx="100" cy="112" r="71" fill="#F8EEEA"/>
    ${seeds.join('')}
  </svg>`;
})();
const pomSvg = () => POM_SVG;
/** 圖卡上方的石榴橫幅（LINE 圖卡用同一張圖的 PNG） */
const bannerHtml = () => `<span class="img" aria-hidden="true">${pomSvg()}<span class="ln"></span></span>`;
const splitVerse = v => { const m = /^「(.+)」\s*(.*)$/.exec(String(v || '').trim()); return m ? { text: m[1], ref: m[2] } : { text: String(v || '').trim(), ref: '' }; };

const VERSES = [
  { text: '第一要為萬人懇求、禱告、代求、祝謝。', ref: '提前 2:1' },
  { text: '祂願意萬人得救，並且完全認識真理。', ref: '提前 2:4' },
  { text: '義人祈求所發的能力，是大有功效的。', ref: '雅 5:16' },
];
const verseText = v => `「${v.text}」${v.ref}`;
const DEFAULT_DESC = '寫下你正在為他禱告的福音朋友，一起同心代禱。';

/* 名字：一行一位，或用頓號、逗號分隔 */
const splitNames = t => [...new Set(String(t || '').split(/[\n,，、;；]+/).map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean))];

/* ================= 預覽模式的範例資料 ================= */
const demo = {
  me: { userId: 'Udemo', displayName: '簡晨光', isAdmin: false },
  walls: [{
    id: 'W1', title: '小區福音代禱牆', tag: '同心代禱', verse: verseText(VERSES[0]), desc: DEFAULT_DESC, allowAdd: true, theme: 'pom', open: true, creator: '簡晨光', created: '2026/11/18 21:30',
    groups: ['北溝社區排', '德福排', '讀經小排', '霧峰姊妹排', '兒童排', '青職排', '七靈社區排', '青少年排', '🏠大專週三李家排', '🏠大專週三弟兄排'],
    names: {
      '北溝社區排': ['陳淑卿', '陳淑幸'], '霧峰姊妹排': ['曾義明', '朱双娥', '曾銘弘', '康英滿'], '兒童排': ['吳禹錫', '吳禹霏', '吳子宸', '林恩予', '黃靈真', '廖竑宇'],
      '青職排': ['寶淑'], '七靈社區排': ['張淑富'], '青少年排': ['林俊昌', '林俊星', '何佳玲', '何佳政', '林嘉雄', '謝賢學', '謝漢澄', '陳姵瑀', '林雪芬', '邱巧恩', '林子芸'],
      '🏠大專週三李家排': ['奎翰', '黃尚鈞', '黃湘庭', '邱繼宥', '張澔文', '徐楷喬', '余方鈞'], '🏠大專週三弟兄排': ['張志強', '李其鳳', '高立倫', '林鎧辰', '吳宗穎', '林英展'],
    },
    mine: { '霧峰姊妹排': ['康英滿'] },
  }],
};
demo.card = { days: [
  { cat: '家人', names: ['爸爸', '媽媽', '小弟'] }, { cat: '親戚', names: ['二舅', '表姊'] }, { cat: '好友', names: ['王同學', '林媽媽', '阿哲'] },
  { cat: '同事(學)', names: ['陳美玲', '小恩'] }, { cat: '鄰居', names: ['李阿姨', '張伯伯'] }, { cat: '聖徒', names: ['陳弟兄', '王姊妹'] }, { cat: '馬路', names: ['便利商店店員'] } ] };
demo.onWall = { '康英滿': ['小區福音代禱牆'] };
let demoSeq = 100;
function demoView(w) {
  const list = w.groups.concat(Object.keys(w.names).filter(g => !w.groups.includes(g))).map(g => ({ name: g, names: (w.names[g] || []).map((n, i) => ({ id: `${g}#${n}`, name: n, mine: ((w.mine || {})[g] || []).includes(n) })) }));
  const total = list.reduce((s, g) => s + g.names.length, 0), filled = list.filter(g => g.names.length).length;
  return { id: w.id, title: w.title, tag: w.tag, verse: w.verse, desc: w.desc, groups: w.groups.slice(), allowAdd: w.allowAdd, theme: w.theme, open: w.open, creator: w.creator, created: w.created, list, total, filled, unfilled: list.length - filled, canManage: true, mine: true };
}
async function demoApi(action, d) {
  await new Promise(r => setTimeout(r, 250));
  const find = id => { const w = demo.walls.find(x => x.id === id); if (!w) throw new Error('找不到這面代禱牆'); return w; };
  switch (action) {
    case 'me': return { ok: true, ...demo.me };
    case 'session': return { ok: true, token: 'demo', expires: Date.now() + 864e5 };
    case 'listWalls': return { ok: true, walls: demo.walls.map(demoView).reverse() };
    case 'wall': return { ok: true, wall: demoView(find(d.wallId)) };
    case 'createWall': {
      const w = { ...d.wall, id: 'W' + (++demoSeq), groups: (d.wall.groups || []).map(g => g.name || g), open: true, creator: demo.me.displayName, created: '剛剛', names: {}, mine: {} };
      demo.walls.push(w); return { ok: true, wall: demoView(w) };
    }
    case 'updateWall': {
      const w = find(d.wallId), names = {};
      (d.wall.groups || []).forEach(g => { const from = g.from || g.name; if (w.names[from]) names[g.name] = w.names[from]; });
      Object.assign(w, { ...d.wall, groups: d.wall.groups.map(g => g.name), names });
      return { ok: true, wall: demoView(w) };
    }
    case 'setOpen': { const w = find(d.wallId); w.open = d.open; return { ok: true, wall: demoView(w) }; }
    case 'deleteWall': demo.walls = demo.walls.filter(x => x.id !== d.wallId); return { ok: true, removed: 0 };
    case 'addNames': {
      const w = find(d.wallId);
      if (!w.open) throw new Error('這面代禱牆已經停止填寫');
      if (!w.groups.includes(d.group)) { if (!w.allowAdd) throw new Error('沒有這個排'); w.groups.push(d.group); }
      const cur = w.names[d.group] = w.names[d.group] || [];
      const added = d.names.filter(n => !cur.includes(n)), skipped = d.names.filter(n => cur.includes(n));
      cur.push(...added); (w.mine[d.group] = w.mine[d.group] || []).push(...added);
      const res = { ok: true, wall: demoView(w), group: d.group, added, skipped };
      if (d.cardDay !== undefined && d.cardDay !== null) { const day = demo.card.days[d.cardDay]; const a = d.names.filter(n => !day.names.includes(n)); day.names.push(...a); res.cardAdded = { day: d.cardDay, cat: day.cat, added: a }; }
      return res;
    }
    case 'removeName': {
      const w = find(d.wallId), [g, n] = d.entryId.split('#');

    }
    case 'getCard': return { ok: true, card: JSON.parse(JSON.stringify(demo.card)), onWall: demo.onWall, walls: demo.walls.map(demoView) };
    case 'saveCard': demo.card = JSON.parse(JSON.stringify(d.card)); return { ok: true, card: d.card };
    case 'myData': return { ok: true, displayName: demo.me.displayName, entries: [{ wall: '小區福音代禱牆', group: '霧峰姊妹排', name: '康英滿', time: '2026/11/20' }], walls: ['小區福音代禱牆'] };
    case 'deleteMyData': return { ok: true, entries: 1 };

  throw new Error('預覽模式不支援：' + action);
}

/* ================= 登入與後端 ================= */
const SESSION_KEY = 'pw.session';
const getSession = () => { try { const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); return s && s.expires > Date.now() + 60000 ? s : null; } catch (e) { return null; } };
const setSession = s => { try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify({ token: s.token, expires: s.expires })) : localStorage.removeItem(SESSION_KEY); } catch (e) {} };
const CACHE_OK = !DEMO;
const cacheGet = k => { if (!CACHE_OK) return null; try { return JSON.parse(localStorage.getItem('pw.c.' + k) || 'null'); } catch (e) { return null; } };
const cacheSet = (k, v) => { if (!CACHE_OK) return; try { localStorage.setItem('pw.c.' + k, JSON.stringify(v)); } catch (e) {} };

async function api(action, data = {}) {
  if (DEMO) return demoApi(action, data);
  const body = { action, ...data };
  const s = action === 'session' ? null : getSession();
  if (s) body.session = s.token; else body.idToken = liff.getIDToken();
  const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'SESSION_EXPIRED') {
      setSession(null);
      if (liff.isLoggedIn()) return api(action, data);
      liff.login({ redirectUri: location.href }); throw new Error('登入已過期，正在重新登入');
    }
    if (j.error === 'TOKEN_EXPIRED') { liff.logout(); liff.login({ redirectUri: location.href }); throw new Error('登入已過期，正在重新登入'); }
    throw new Error(j.error);
  }
  return j;
}

/* ================= 入口 ================= */
async function main() {
  try {
    if (PARAMS.has('install')) return installFlow();
    if (!DEMO) {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn() && !getSession()) { liff.login({ redirectUri: location.href }); return; }
      if (liff.isLoggedIn() && !getSession()) { try { setSession(await api('session')); } catch (e) {} }
    }
    const wallId = PARAMS.get('wall') || (DEMO && PARAMS.get('demo') === 'wall' ? 'W1' : '');
    const shareId = PARAMS.get('share');
    if (PARAMS.has('mydata')) await myDataFlow();
    else if (shareId) await forwardFlow(shareId);
    else if (wallId) await wallFlow(wallId);
    else await platformFlow();
  } catch (e) {
    view(`<section class="solo"><div class="msg-card"><div style="font-size:34px">🙏</div><h1>無法開啟</h1><p>${esc(e.message)}</p><p class="muted small">請關閉後從 LINE 重新開啟一次。</p></div></section>`);
  }
}

/* ================= 成員：代禱牆頁 ================= */
let WALL = null, PICK = '', FRESH = new Set();

async function wallFlow(id) {
  const cached = cacheGet('wall.' + id);
  if (cached) { WALL = cached; drawWall(); }
  else view(loading());
  try {
    const { wall } = await api('wall', { wallId: id });
    const typed = $('names') ? $('names').value : '';
    WALL = wall; cacheSet('wall.' + id, wall); drawWall();
    if (typed && $('names')) $('names').value = typed;
  } catch (e) { if (cached) toast(e.message); else throw e; }
}

function heroHtml(w) {
  const seeds = w.list.map(g => `<span class="seed ${g.names.length ? 'f' : ''}"></span>`).join('');
  return `<section class="hero">
      <div class="art">${pomSvg()}</div>
      <div class="label">${w.tag ? `<span class="tag">${esc(w.tag)}</span>` : ''}<h1>${esc(w.title)}</h1></div>
    </section>
    ${w.desc ? `<p class="intro">${esc(w.desc)}</p>` : ''}
    <div class="stats">
      <div><b>${w.total}</b><span>位福音朋友</span></div>
      <div><b>${w.filled}</b><span>個排已填寫</span></div>
      <div><b>${w.unfilled}</b><span>個排還沒填</span></div>
    </div>
    ${seeds ? `<div class="seeds" aria-hidden="true" title="每一顆石榴籽是一個排，紅色是已經填寫">${seeds}</div>` : ''}`;
}

function verseHtml(w) {
  if (!w.verse) return '';
  const v = splitVerse(w.verse);
  return `<blockquote class="verse">${esc(v.text)}${v.ref ? `<cite>${esc(v.ref)}</cite>` : ''}</blockquote>`;
}

function listHtml(w, removable) {
  return w.list.map(g => g.names.length ? `<section class="wall-group">
      <h3><span>${esc(g.name)}</span><small>${g.names.length} 位</small></h3>
      <div class="names">${g.names.map(n => (removable(n)
        ? `<span class="name mine ${FRESH.has(n.id) ? 'fresh' : ''}"><span>${esc(n.name)}</span><button type="button" data-del="${esc(n.id)}" aria-label="刪除 ${esc(n.name)}">×</button></span>`
        : `<span class="name ${FRESH.has(n.id) ? 'fresh' : ''}"><span>${esc(n.name)}</span></span>`)).join('')}</div>
    </section>` : `<section class="wall-group empty"><h3><span>${esc(g.name)}</span><small>還沒有名單</small></h3></section>`).join('');
}

function bindRemove(scope, wallId, after) {
  scope.querySelectorAll('[data-del]').forEach(b => b.onclick = () => armThen(b, '刪除？', async () => {
    b.disabled = true;
    try { const r = await api('removeName', { wallId, entryId: b.dataset.del }); after(r.wall); toast('已刪除'); }
    catch (e) { toast(e.message); b.disabled = false; }
  }));
}

function canPost() {
  if (DEMO) return true;
  const ctx = inClient() ? liff.getContext() : null;
  return !!ctx && ['group', 'room', 'utou'].includes(ctx.type);
}

function drawWall() {
  const w = WALL;
  applyTheme(w);
  document.title = w.title;
  if (PICK && !w.list.some(g => g.name === PICK)) PICK = '';
  const postable = canPost();
  let autoPost = true; try { autoPost = localStorage.getItem('pw.autopost') !== '0'; } catch (e) {}
  const mineCount = w.list.reduce((s, g) => s + g.names.filter(n => n.mine).length, 0);
  let toCard = true, cardDay = 2;
  try { toCard = localStorage.getItem('pw.tocard') !== '0'; const v = localStorage.getItem('pw.cardday'); if (v !== null) cardDay = +v; } catch (e) {}
  view(`
    ${DEMO ? `<p class="demo-note">預覽模式：目前使用範例資料。</p>` : ''}
    ${heroHtml(w)}
    ${w.open ? '' : `<p class="closed-note">這面代禱牆已經停止填寫，仍然可以看名單、一起代禱。</p>`}
    ${w.open ? `<section class="card dot" aria-labelledby="fill-h">
      <h2 id="fill-h">填寫代禱名單</h2>
      <p class="step"><b>一</b>選擇你的排</p>
      <div class="group-pick" role="group" aria-label="選擇你的排">
        ${w.list.map(g => `<button type="button" data-pick="${esc(g.name)}" aria-pressed="${g.name === PICK}"><span>${esc(g.name)}</span>${g.names.length ? `<span class="c">${g.names.length}</span>` : ''}</button>`).join('')}
        ${w.allowAdd ? `<button type="button" class="add" id="add-group">＋ 我的排不在這裡</button>` : ''}
      </div>
      <div class="new-group" id="new-group" hidden><input class="inp" id="new-group-name" maxlength="20" placeholder="輸入排的名稱"><button class="btn small send" type="button" id="new-group-ok">加入</button></div>
      <p class="step" style="margin-top:18px"><b>二</b>填入名字</p>
      <div class="field" style="margin:0"><textarea id="names" aria-label="福音朋友的名字" placeholder="一行一位，或用「、」分隔&#10;例如：王小明、陳美玲"></textarea></div>
      <p class="hint">為了保護隱私，可以只寫姓氏加稱呼，例如「王同學」「林媽媽」。</p>
      <div class="switch-row" style="margin-top:16px">
        <div><b>送出後貼到聊天室</b><small>${postable ? '把最新的代禱牆圖卡貼回群組' : '從群組裡的圖卡打開時才能貼回聊天室'}</small></div>
        <label class="switch"><input type="checkbox" id="autopost" ${postable && autoPost ? 'checked' : ''} ${postable ? '' : 'disabled'} aria-label="送出後貼到聊天室"><span></span></label>
      </div>
      <div class="switch-row" style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule)">
        <div><b>同時加入我的代禱卡</b><small>每天為他們禱告；名字只有你看得到</small></div>
        <label class="switch"><input type="checkbox" id="tocard" ${toCard ? 'checked' : ''} aria-label="同時加入我的代禱卡"><span></span></label>
      </div>
      <div class="day-pick" id="card-day" role="group" aria-label="放在代禱卡的哪一天" ${toCard ? '' : 'hidden'}>${cardCats().map((c, i) => `<button type="button" data-cd="${i}" aria-pressed="${i === cardDay}">${dayLabel(i)}・${esc(c)}</button>`).join('')}</div>
      <p class="posted" id="posted" hidden></p>
    </section>` : ''}
    <section class="card" aria-labelledby="list-h">
      <h2 id="list-h">各排代禱名單 <small>共 ${w.total} 位</small></h2>
      <div id="wall-list">${listHtml(w, n => n.mine || w.canManage)}</div>
      ${mineCount || w.canManage ? `<p class="hint" style="margin-top:12px">${w.canManage ? '你是這面代禱牆的建立者，每個名字旁都有 ×，可以刪除。' : '你填的名字旁邊有 ×，可以自己刪除。'}</p>` : ''}
      <button class="btn share" style="margin-top:14px" id="repost">${ICON_SEND}把代禱牆貼到聊天室</button>
    </section>
    ${verseHtml(w)}
    <footer class="page-foot">
      <button class="link" id="mycard">我的代禱卡</button>
      <button class="link" id="fwd">轉傳給其他群組或朋友</button>
      ${w.canManage ? `<button class="link" id="manage">管理這面代禱牆</button>` : ''}
      <button class="link" onclick="myDataFlow()">我的個人資料</button>
    </footer>
    ${w.open ? `<div class="dock"><div class="inner"><button class="btn send" id="submit">${ICON_SEND}送出代禱名單</button></div></div>` : ''}`);
  FRESH.clear();
  window.scrollTo(0, SCROLL_KEEP); SCROLL_KEEP = 0;

  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    PICK = b.dataset.pick;
    document.querySelectorAll('[data-pick]').forEach(x => x.setAttribute('aria-pressed', x === b));
    if ($('new-group')) $('new-group').hidden = true;
  });
  if ($('add-group')) {
    $('add-group').onclick = () => { $('new-group').hidden = false; $('new-group-name').focus(); };
    const addG = () => {
      const name = $('new-group-name').value.replace(/\s+/g, ' ').trim().slice(0, 20);
      if (!name) return toast('請輸入排的名稱');
      if (!w.list.some(g => g.name === name)) w.list.push({ name, names: [] });
      PICK = name; keepTyped(drawWall);
      toast(`已選擇「${name}」，填好名字送出後就會加入`);
    };
    $('new-group-ok').onclick = addG;
    $('new-group-name').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); addG(); } };
  }
  if ($('autopost')) $('autopost').onchange = e => { try { localStorage.setItem('pw.autopost', e.target.checked ? '1' : '0'); } catch (x) {} };
  bindRemove($('wall-list'), w.id, wall => { WALL = wall; cacheSet('wall.' + wall.id, wall); keepTyped(drawWall); });
  $('repost').onclick = async () => { const b = $('repost'); b.disabled = true; await postWall(w); b.disabled = false; };
  $('fwd').onclick = () => share(w);
  $('mycard').onclick = () => { location.href = `${location.pathname}?tab=card${DEMO ? '&demo' : ''}`; };
  if ($('tocard')) {
    $('tocard').onchange = e => { $('card-day').hidden = !e.target.checked; try { localStorage.setItem('pw.tocard', e.target.checked ? '1' : '0'); } catch (x) {} };
    document.querySelectorAll('[data-cd]').forEach(b => b.onclick = () => { document.querySelectorAll('[data-cd]').forEach(x => x.setAttribute('aria-pressed', x === b)); try { localStorage.setItem('pw.cardday', b.dataset.cd); } catch (x) {} });
  }
  if ($('manage')) $('manage').onclick = () => { location.href = `${location.pathname}?manage=${encodeURIComponent(w.id)}${DEMO ? '&demo' : ''}`; };
  if ($('submit')) $('submit').onclick = submitNames;
}

let SCROLL_KEEP = 0;
/** 重畫時保留捲動位置與還沒送出的名字 */
function keepTyped(fn) {
  const typed = $('names') ? $('names').value : '';
  SCROLL_KEEP = window.scrollY;
  fn();
  if (typed && $('names')) $('names').value = typed;
}

async function submitNames() {
  const btn = $('submit');
  const names = splitNames($('names').value);
  if (!PICK) { toast('請先選擇你的排'); document.querySelector('.group-pick').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if (!names.length) { toast('請填入至少一位福音朋友的名字'); $('names').focus(); return; }
  if (names.length > 30) { toast('一次最多填 30 位，請分次送出'); return; }
  btn.disabled = true; btn.textContent = '送出中…';
  const auto = $('autopost') && $('autopost').checked;
  try {
    const cdBtn = document.querySelector('[data-cd][aria-pressed="true"]');
    const cardDay = $('tocard') && $('tocard').checked && cdBtn ? +cdBtn.dataset.cd : null;
    const r = await api('addNames', { wallId: WALL.id, group: PICK, names, cardDay });
    if (r.cardAdded) { try { localStorage.removeItem('pw.c.card'); } catch (e) {} }
    WALL = r.wall; cacheSet('wall.' + WALL.id, WALL);
    const g = WALL.list.find(x => x.name === r.group);
    if (g) g.names.filter(n => r.added.includes(n.name)).forEach(n => FRESH.add(n.id));
    SCROLL_KEEP = 0; drawWall();
    const say = r.added.length ? `已為${r.group}加入 ${r.added.length} 位${r.skipped.length ? `（${r.skipped.join('、')} 已經在名單上）` : ''}` : `${r.skipped.join('、')} 已經在名單上了`;
    toast(say + (r.cardAdded && r.cardAdded.added.length ? `，也放進你代禱卡的「${r.cardAdded.cat}」` : ''));
    if (auto && r.added.length) await postWall(WALL, `${r.group} 加入了 ${r.added.length} 位`);
    const list = $('list-h'); if (list) setTimeout(() => list.scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
  } catch (e) {
    toast(e.message); btn.disabled = false; btn.innerHTML = `${ICON_SEND}送出代禱名單`;
  }
}

/** 以使用者名義在原本的聊天室貼出最新的代禱牆圖卡 */
async function postWall(w, news) {
  const note = $('posted');
  const say = (t, warn) => { if (note) { note.hidden = false; note.textContent = t; note.classList.toggle('warn', !!warn); } else toast(t); };
  if (DEMO) { say('預覽模式：正式版會在群組貼出最新的代禱牆圖卡'); return true; }
  if (!canPost()) { say('要從群組裡的圖卡打開，才能貼回聊天室。也可以用「轉傳給其他群組或朋友」。', true); return false; }
  try {
    if (liff.permission) {
      const p = await liff.permission.query('chat_message.write').catch(() => null);
      if (p && p.state === 'prompt') await liff.permission.requestAll().catch(() => {});
    }
    await liff.sendMessages([buildWallFlex(w, news)]);
    say('已把最新的代禱牆貼到聊天室');
    return true;
  } catch (e) {
    say(`沒有貼到聊天室（${e.code ? e.code + '：' : ''}${e.message}）。名單已經送出。`, true);
    return false;
  }
}

/* ================= 轉傳 ================= */
async function share(w) {
  if (DEMO) { toast('預覽模式：正式版會在這裡跳出群組選單'); return false; }
  if (!liff.isLoggedIn()) { toast('發送到群組前需要登入 LINE 一次'); setTimeout(() => liff.login({ redirectUri: location.href }), 600); return false; }
  if (!liff.isApiAvailable('shareTargetPicker')) { toast('無法開啟群組選單，請確認 LIFF 已開啟 Share target picker'); return false; }
  try {
    const res = await liff.shareTargetPicker([buildWallFlex(w)], { isMultiple: true });
    toast(res ? '已發送' : '已取消發送');
    return !!res;
  } catch (e) { toast('發送失敗：' + e.message); return false; }
}

async function forwardFlow(id) {
  view(loading());
  const { wall } = await api('wall', { wallId: id });
  applyTheme(wall);
  view(`<section class="solo">
    <div class="pv-panel">${cardHtml(wall)}</div>
    <p class="muted" style="text-align:center">把這面代禱牆轉傳給其他群組或朋友，可以一次勾選好幾個。</p>
    <button class="btn line" id="go">${ICON_SEND}選擇群組或朋友</button>
    <button class="btn ghost" style="margin-top:10px" id="open">打開代禱牆</button>
  </section>`);
  $('go').onclick = async () => { if (await share(wall) && inClient()) liff.closeWindow(); };
  $('open').onclick = () => { location.href = `${location.pathname}?wall=${encodeURIComponent(id)}`; };
}

/* ================= 群組裡的圖卡（Flex Message） ================= */
const FLEX_LIMIT = 27000; // LINE 單張圖卡約 30KB 上限，留一點餘裕
const byteLen = o => new TextEncoder().encode(JSON.stringify(o)).length;
const C = { sheet: '#FBFAF2', ink: '#2E322F', muted: '#767B73', line: '#A8ACA4', rule: '#D9D8CC' };
const pill = (text, t) => ({ type: 'box', layout: 'vertical', flex: 0, backgroundColor: t.pill, cornerRadius: 'xxl', paddingStart: '10px', paddingEnd: '10px', paddingTop: '2px', paddingBottom: '2px',
  contents: [{ type: 'text', text, size: 'xs', weight: 'bold', color: t.bar }] });
const seedDot = t => ({ type: 'box', layout: 'vertical', width: '9px', height: '13px', cornerRadius: '5px', backgroundColor: t.bar, contents: [] });
const statBox = (n, label, t) => ({ type: 'box', layout: 'vertical', flex: 1, paddingTop: '8px', paddingBottom: '8px', contents: [
  { type: 'text', text: String(n), size: 'xxl', weight: 'bold', color: t.g2, align: 'center' },
  { type: 'text', text: label, size: 'xxs', color: C.muted, align: 'center' } ] });

function buildWallFlex(w, news, opt = {}) {
  const t = themeOf(w);
  const perGroup = opt.perGroup || 40, maxGroups = opt.maxGroups || 40;
  const filled = w.list.filter(g => g.names.length), empty = w.list.filter(g => !g.names.length);
  const shown = filled.slice(0, maxGroups);
  const groupBox = g => {
    const names = g.names.map(n => n.name);
    const text = names.slice(0, perGroup).join(' · ') + (names.length > perGroup ? ` …等 ${names.length} 位` : '');
    return { type: 'box', layout: 'vertical', borderColor: C.rule, borderWidth: '1px', cornerRadius: 'lg', paddingAll: '12px', spacing: 'sm', contents: [
      { type: 'box', layout: 'horizontal', spacing: 'md', alignItems: 'center', contents: [
        seedDot(t),
        { type: 'text', text: g.name, weight: 'bold', size: 'md', color: t.g2, flex: 1, wrap: true },
        pill(`${names.length} 位`, t) ] },
      { type: 'text', text, size: 'sm', color: C.ink, wrap: true } ] };
  };
  const list = shown.map(groupBox);
  if (filled.length > shown.length) list.push({ type: 'text', text: `…還有 ${filled.length - shown.length} 個排，打開代禱牆看完整名單`, size: 'xs', color: C.muted, wrap: true, margin: 'sm' });
  if (empty.length) list.push({ type: 'text', text: `還沒有名單：${empty.map(g => g.name).join('、')}`.slice(0, 300), size: 'xs', color: C.muted, wrap: true, margin: 'sm' });
  if (!list.length) list.push({ type: 'text', text: '還沒有人填寫，第一位來為福音朋友代禱吧！', size: 'sm', color: C.muted, wrap: true, align: 'center' });

  const head = [];
  if (w.tag) head.push({ type: 'box', layout: 'horizontal', contents: [{ type: 'box', layout: 'vertical', flex: 0, borderColor: t.bar, borderWidth: '1px', cornerRadius: 'xxl', paddingStart: '9px', paddingEnd: '9px',
    contents: [{ type: 'text', text: w.tag, size: 'xs', color: t.bar }] }] });
  head.push({ type: 'text', text: w.title, color: t.g2, weight: 'bold', size: 'xxl', wrap: true, margin: 'sm' });
  if (w.verse) head.push({ type: 'text', text: w.verse, color: C.muted, size: 'xs', wrap: true, margin: 'sm' });
  head.push({ type: 'box', layout: 'horizontal', margin: 'lg', borderColor: C.line, borderWidth: '1px', cornerRadius: 'lg', contents: [
    statBox(w.total, '位福音朋友', t), { type: 'separator', color: C.line }, statBox(w.filled, '個排已填', t), { type: 'separator', color: C.line }, statBox(w.unfilled, '個排未填', t)] });

  const flex = {
    type: 'flex',
    altText: `🙏 ${w.title}：${news ? news + '，' : ''}共 ${w.total} 位福音朋友，${w.filled} 個排已填`.slice(0, 400),
    contents: {
      type: 'bubble', size: 'mega',
      styles: { body: { backgroundColor: C.sheet }, footer: { backgroundColor: C.sheet } },
      hero: { type: 'image', url: `${SITE}img/hero-${w.theme in THEMES ? w.theme : 'pom'}.png`, size: 'full', aspectRatio: '20:9', aspectMode: 'cover', action: { type: 'uri', uri: wallUrl(w.id) } },
      body: { type: 'box', layout: 'vertical', paddingAll: '18px', spacing: 'md', contents: [
        { type: 'box', layout: 'vertical', contents: head },
        { type: 'box', layout: 'vertical', spacing: 'sm', margin: 'lg', contents: list } ] },
      footer: { type: 'box', layout: 'vertical', paddingAll: '14px', paddingTop: '0px', paddingBottom: '6px', contents: [
        { type: 'button', style: 'primary', color: t.bar, height: 'sm', action: { type: 'uri', label: w.open === false ? '打開代禱牆' : '📝 我也要填代禱名單', uri: wallUrl(w.id) } },
        { type: 'box', layout: 'horizontal', margin: 'sm', contents: [
          { type: 'button', style: 'link', height: 'sm', color: t.bar, flex: 1, action: { type: 'uri', label: '我的代禱卡', uri: `https://liff.line.me/${LIFF_ID}?tab=card` } },
          { type: 'button', style: 'link', height: 'sm', color: C.muted, flex: 1, action: { type: 'uri', label: '轉傳', uri: shareUrl(w.id) } } ] } ] },
    },
  };
  if (byteLen(flex) <= FLEX_LIMIT) return flex;
  // 太大就逐步縮小：每排少列幾個名字，再不夠就少列幾個排
  if (perGroup > 12) return buildWallFlex(w, news, { perGroup: 12, maxGroups });
  if (perGroup > 5) return buildWallFlex(w, news, { perGroup: 5, maxGroups });
  if (maxGroups > 8) return buildWallFlex(w, news, { perGroup, maxGroups: Math.max(8, Math.floor(maxGroups * 0.7)) });
  return flex;
}

/** 網頁上的圖卡預覽，盡量長得跟 LINE 裡一樣 */
function cardHtml(w) {
  const t = themeOf(w);
  const filled = w.list.filter(g => g.names.length), empty = w.list.filter(g => !g.names.length);
  return `<div class="lc" style="${themeVars(t)}">
    ${bannerHtml()}
    <div class="h">${w.tag ? `<span class="tg">${esc(w.tag)}</span>` : ''}<div class="ti">${esc(w.title || '代禱牆名稱')}</div>${w.verse ? `<div class="vs">${esc(w.verse)}</div>` : ''}

/* ================= 個人代禱卡（延續金香壇代禱卡：一週七天、每天一個類別） ================= */
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const dayLabel = i => i === 0 ? '主日' : '週' + WD[i];
const CARD_CATS = ['家人', '親戚', '好友', '同事(學)', '鄰居', '聖徒', '馬路'];
const CARD_VERSE = { text: '至於我，斷不停止為你們禱告，免得我得罪耶和華…', ref: '撒母耳記上十二章23節' };
const blankCard = () => ({ days: CARD_CATS.map(cat => ({ cat, names: [] })) });
const cardCats = () => (CARD || cacheGet('card') || blankCard()).days.map(d => d.cat);
let CARD = null, ON_WALL = {}, JOINED = [], CARD_SEL = new Date().getDay(), CARD_MODE = 'view', CARD_DRAFT = null, PASTE_TEXT = '', PASTE_PARSED = null;
let PENDING_IMPORT = null;
const todayKey = () => { const d = new Date(); return `pw.marks.${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
let MARKS = {}; try { MARKS = JSON.parse(localStorage.getItem(todayKey()) || '{}') || {}; } catch (e) {}
const saveMarks = () => { try { localStorage.setItem(todayKey(), JSON.stringify(MARKS)); } catch (e) {} };

/* 名單代碼：和金香壇代禱卡的「GIA1.」代碼互通 */
const b64e = str => { const b = new TextEncoder().encode(str); let o = ''; b.forEach(x => o += String.fromCharCode(x)); return btoa(o).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const b64d = str => { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; const o = atob(str), b = new Uint8Array(o.length); for (let i = 0; i < o.length; i++) b[i] = o.charCodeAt(i); return new TextDecoder().decode(b); };
const encodeList = c => 'GIA1.' + b64e(JSON.stringify({ days: c.days.map(d => ({ cat: d.cat, names: d.names.concat(Array(Math.max(0, 12 - d.names.length)).fill('')) })) }));
function decodeList(txt) {
  txt = String(txt || '').trim();
  const m = /[#&?]n=([A-Za-z0-9_-]+)/.exec(txt) || /[?&]import=GIA1\.([A-Za-z0-9_-]+)/.exec(txt);
  const c = m ? m[1] : txt.replace(/^[\s\S]*GIA1\./, '').replace(/[^A-Za-z0-9_-]/g, '');
  if (!c) return null;
  try { const d = JSON.parse(b64d(c)); return d && Array.isArray(d.days) && d.days.length === 7 ? d : null; } catch (e) { return null; }
}
function mergeCard(cur, inc) {
  const out = JSON.parse(JSON.stringify(cur)); let added = 0;
  for (let i = 0; i < 7; i++) {
    const have = new Set(out.days[i].names);
    ((inc.days[i] || {}).names || []).forEach(n => { n = String(n || '').trim(); if (!n || have.has(n)) return; have.add(n); out.days[i].names.push(n); added++; });
  }
  return { card: out, added };
}
/* 貼上一段文字（例如照片辨識出來的），遇到「週三」「家人」等標題就分到那一天 */
const CATIDX = { '家人': 0, '親戚': 1, '好友': 2, '同事': 3, '鄰居': 4, '聖徒': 5, '馬路': 6 }, DAYCH = { '日': 0, '天': 0, '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6 };
function parsePasted(txt, defDay) {
  const days = {}; let cur = defDay;
  const dayRe = /^(主日|[週周]\s*[一二三四五六]|星期[一二三四五六日天]|禮拜[一二三四五六日天])/, catRe = /(家人|親戚|好友|同事|鄰居|聖徒|馬路)/;
  String(txt || '').replace(/\r/g, '').split('\n').forEach(line => {
    let l = line.trim(); if (!l) return;
    const m = dayRe.exec(l), c = catRe.exec(l);
    if (m || c) {
      if (m) { const w = m[1].replace(/\s/g, ''); cur = w === '主日' ? 0 : DAYCH[w.slice(-1)]; } else cur = CATIDX[c[1]];
      l = l.replace(dayRe, '').replace(/^[\s\-－–—:：]*/, '').replace(/^(同事\s*[（(]\s*學\s*[)）]|家人|親戚|好友|同事|鄰居|聖徒|馬路)[\s\-－–—:：]*/, '').trim();
      if (!l) return;
    }
    l.split(/[\s,，、;；／/|｜•·・]+/).forEach(t => {
      t = t.replace(/^[\d０-９]+[\.．、)）]?\s*/, '').replace(/[.。,，;；:：!！?？()（）\[\]「」『』"'“”…]/g, '').trim();
      if (!t || /^[\d０-９]+$/.test(t) || t.length > 20) return;
      const arr = days[cur] = days[cur] || []; if (!arr.includes(t)) arr.push(t);
    });
  });
  return days;
}
function cardText(i) {
  const d = CARD.days[i];
  return `金香壇代禱｜${dayLabel(i)}－${d.cat}\n${d.names.length ? d.names.map((n, k) => `${k + 1}. ${n}`).join('\n') : '（尚無名單）'}\n\n撒上十二23「${CARD_VERSE.text}」\n\n我的代禱卡：https://liff.line.me/${LIFF_ID}?tab=card`;
}
async function persistCard(card, msg) {
  CARD = card; cacheSet('card', CARD);
  try { const r = await api('saveCard', { card }); CARD = r.card; cacheSet('card', CARD); if (msg) toast(msg); }
  catch (e) { toast('儲存失敗：' + e.message); }
}

function renderCard() {
  if (!CARD) { $('panel').innerHTML = loading(); return; }
  const today = new Date().getDay(), sel = CARD_SEL, d = CARD.days[sel];
  const marked = new Set((MARKS[sel] || []).filter(n => d.names.includes(n)));
  const dayNav = `<nav class="days" role="tablist" aria-label="選擇代禱日">${CARD.days.map((x, i) => `<button role="tab" aria-selected="${i === sel}" class="day ${i === sel ? 'on' : ''} ${i === today ? 'today' : ''}" data-day="${i}"><span class="wd">${i === 0 ? '主日' : WD[i]}</span><span class="ct">${esc(x.cat)}</span></button>`).join('')}</nav>`;
  const pend = PENDING_IMPORT ? `<div class="import-note"><p><b>收到一份代禱卡名單</b>（${PENDING_IMPORT.days.reduce((s, x) => s + x.names.filter(n => String(n).trim()).length, 0)} 個名字），要合併到你的代禱卡嗎？原有的名字不會被刪掉。</p><div class="actions"><button class="btn small send" id="imp-ok">合併</button><button class="btn small ghost" id="imp-no">略過</button></div></div>` : '';
  let body = '';
  if (CARD_MODE === 'edit') {
    const n = CARD_DRAFT.names;
    body = `<label class="field cat-edit"><span>這一天的類別</span><input id="cat-in" maxlength="8" value="${esc(CARD_DRAFT.cat)}"></label>
      <div class="grid">${n.map((x, i) => `<input class="cell-in" data-ci="${i}" maxlength="20" value="${esc(x)}" placeholder="名字或暱稱" aria-label="第 ${i + 1} 格">`).join('')}</div>
      <p class="hint">清空格子就是刪除。名字只有你自己看得到，放上代禱牆時才會讓別人看到。</p>
      <div class="actions"><button class="btn small" id="cell-add">＋ 新增格子</button><button class="btn small send" id="edit-save">儲存並更新</button><button class="btn small ghost" id="edit-cancel">取消</button></div>`;
  } else if (CARD_MODE === 'paste') {
    const p = PASTE_PARSED;
    body = `<div class="paste"><p class="paste-title">貼上名字</p>
      <p class="paste-sub">把照片辨識出來的文字或聊天記錄整段貼進來，名字之間用空格、換行或逗號隔開都可以。若文字裡有「主日」「週三」或「家人」「鄰居」等標題，會自動分到對應的那一天。</p>
      ${p ? Object.keys(p).sort().map(k => `<p class="paste-day">${dayLabel(+k)}－${esc(CARD.days[k].cat)}（${p[k].length}）</p><div class="names">${p[k].map(x => `<span class="name"><span>${esc(x)}</span></span>`).join('')}</div>`).join('') : `<textarea class="inp" id="paste-in" placeholder="例如：陳弟兄 王姊妹 小恩">${esc(PASTE_TEXT)}</textarea>`}
      <div class="actions">${p ? `<button class="btn small send" id="paste-add">加入名單</button><button class="btn small ghost" id="paste-back">回去修改</button>` : `<button class="btn small send" id="paste-parse">整理成名字</button><button class="btn small ghost" id="paste-cancel">取消</button>`}</div></div>`;
  } else if (CARD_MODE === 'code') {
    const code = encodeList(CARD);
    body = `<div class="paste code"><p class="paste-title">名單代碼</p>
      <p class="paste-sub">和「金香壇代禱卡」的名單代碼互通。把同伴傳來的代碼（GIA1. 開頭）貼在這裡，會合併到你的代禱卡，不會刪掉原有的名字。</p>
      <textarea class="inp" id="code-in" placeholder="GIA1.…"></textarea>
      <div class="actions"><button class="btn small send" id="code-import">匯入名單</button><button class="btn small" id="code-copy">複製我的名單代碼</button><button class="btn small" id="code-link">複製含名單的連結</button><button class="btn small ghost" id="code-close">收起</button></div>
      <p class="hint">你的代碼有 ${code.length} 個字，只會複製，不會公開。</p></div>`;
  } else {
    const slots = d.names.slice(); while (slots.length < 12 || slots.length % 2) slots.push('');
    body = `<div class="seeds" aria-hidden="true">${d.names.map(n => `<span class="seed ${marked.has(n) ? 'f' : ''}"></span>`).join('')}</div>
      <p class="count">${d.names.length ? `已代禱 ${marked.size}／${d.names.length}` : '這一天還沒有名字'}</p>
      <div class="grid">${slots.map(n => n ? `<button class="cell ${marked.has(n) ? 'done' : ''}" data-mark="${esc(n)}" aria-pressed="${marked.has(n)}"><span>${esc(n)}</span>${ON_WALL[n] ? `<span class="wb" title="已放上：${esc(ON_WALL[n].join('、'))}">牆</span>` : ''}</button>` : `<button class="cell" disabled aria-hidden="true"></button>`).join('')}</div>
      ${d.names.length ? `<p class="hint">點名字標記今天已經為他禱告。標「牆」的已經放上團體代禱牆。</p>` : `<p class="empty">這一天的名單是空的，點「編輯名單」加入名字。</p>`}
      <div class="actions">

        <button class="btn send" id="card-towall">放上代禱牆</button>
        <button class="btn line" id="card-line">傳到 LINE</button>
      </div>
      <div class="actions tools">
        <button class="btn code" id="card-copy">複製名單</button>
        <button class="btn code" id="card-paste">貼上名字</button>
        <button class="btn code" id="card-code">名單代碼</button>
      </div>`;
  }
  $('panel').innerHTML = `${pend}${dayNav}
    <section class="pcard">
      <div class="head"><span class="wd">${dayLabel(sel)}</span>${sel === today ? '<span class="tag">今天</span>' : ''}<h2>${esc(d.cat)}</h2></div>
      ${body}
    </section>
    <blockquote class="verse">${esc(CARD_VERSE.text)}<cite>${esc(CARD_VERSE.ref)}</cite></blockquote>`;
  bindCard();
}

function bindCard() {
  const sel = CARD_SEL, d = CARD.days[sel];
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => {
    if (CARD_MODE === 'edit') return toast('請先儲存或取消編輯');
    CARD_SEL = +b.dataset.day; CARD_MODE = 'view'; PASTE_PARSED = null; renderCard();
  });
  if ($('imp-ok')) {
    $('imp-ok').onclick = async () => { const r = mergeCard(CARD, PENDING_IMPORT); PENDING_IMPORT = null; renderCard(); await persistCard(r.card, r.added ? `已匯入 ${r.added} 個名字` : '這些名字都已經在名單裡了'); renderCard(); };
    $('imp-no').onclick = () => { PENDING_IMPORT = null; renderCard(); };
  }
  document.querySelectorAll('[data-mark]').forEach(b => b.onclick = () => {
    const n = b.dataset.mark, set = new Set(MARKS[sel] || []);
    set.has(n) ? set.delete(n) : set.add(n);
    MARKS[sel] = [...set]; saveMarks(); renderCard();
  });
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('card-edit', () => { CARD_MODE = 'edit'; const n = d.names.slice(); while (n.length < 12 || n.length % 2) n.push(''); CARD_DRAFT = { cat: d.cat, names: n }; renderCard(); });
  on('cell-add', () => { readDraft(); CARD_DRAFT.names.push('', ''); renderCard(); const all = document.querySelectorAll('[data-ci]'); all[all.length - 2].focus(); });
  on('edit-cancel', () => { CARD_MODE = 'view'; renderCard(); });
  on('edit-save', async () => {
    readDraft();
    const card = JSON.parse(JSON.stringify(CARD)), seen = new Set();
    card.days[sel] = { cat: CARD_DRAFT.cat.trim() || CARD_CATS[sel], names: CARD_DRAFT.names.map(x => x.replace(/\s+/g, ' ').trim()).filter(x => x && !seen.has(x) && seen.add(x)) };
    CARD_MODE = 'view'; renderCard(); await persistCard(card, '已儲存'); renderCard();
  });
  on('card-paste', () => { CARD_MODE = 'paste'; PASTE_PARSED = null; renderCard(); $('paste-in').focus(); });
  on('paste-cancel', () => { CARD_MODE = 'view'; PASTE_TEXT = ''; renderCard(); });
  on('paste-parse', () => {
    PASTE_TEXT = $('paste-in').value;
    const p = parsePasted(PASTE_TEXT, sel);
    if (!Object.keys(p).length) return toast('沒有找到名字，請先把文字貼進來');
    PASTE_PARSED = p; renderCard();
  });
  on('paste-back', () => { PASTE_PARSED = null; renderCard(); });
  on('paste-add', async () => {
    const inc = blankCard(); Object.keys(PASTE_PARSED).forEach(k => { inc.days[k].names = PASTE_PARSED[k]; });
    const r = mergeCard(CARD, inc); CARD_MODE = 'view'; PASTE_PARSED = null; PASTE_TEXT = ''; renderCard();
    await persistCard(r.card, r.added ? `已加入 ${r.added} 個名字` : '名單裡的名字都已經有了，沒有新增'); renderCard();
  });
  on('card-code', () => { CARD_MODE = 'code'; renderCard(); });
  on('code-close', () => { CARD_MODE = 'view'; renderCard(); });
  on('code-copy', () => copyText(encodeList(CARD), '已複製名單代碼，貼到 LINE 給同伴'));
  on('code-link', () => copyText(`https://liff.line.me/${LIFF_ID}?tab=card&import=${encodeList(CARD)}`, '已複製連結，同伴打開就能匯入這份名單'));
  on('code-import', async () => {
    const inc = decodeList($('code-in').value);
    if (!inc) return toast('看不懂這段代碼，請確認是「名單代碼」（GIA1. 開頭）');
    const r = mergeCard(CARD, inc); CARD_MODE = 'view'; renderCard();
    await persistCard(r.card, r.added ? `已匯入 ${r.added} 個名字` : '這些名字都已經在名單裡了'); renderCard();
  });
  on('card-copy', () => copyText(cardText(sel), '已複製，可以貼到 LINE'));
  on('card-line', () => shareText(cardText(sel)));
  on('card-towall', () => { TOWALL = { picked: new Set(), wallId: '', group: '' }; go({ view: 'towall' }); });
}
function readDraft() {
  if ($('cat-in')) CARD_DRAFT.cat = $('cat-in').value;
  document.querySelectorAll('[data-ci]').forEach(i => { CARD_DRAFT.names[+i.dataset.ci] = i.value; });
}
function copyText(text, done) { navigator.clipboard.writeText(text).then(() => toast(done), () => toast('無法複製，請長按文字自行複製')); }
async function shareText(text) {
  if (DEMO) return toast('預覽模式：正式版會跳出 LINE 的選擇畫面');
  if (!liff.isApiAvailable('shareTargetPicker')) return copyText(text, '已複製，可以貼到 LINE');
  try { const r = await liff.shareTargetPicker([{ type: 'text', text: text.slice(0, 4900) }], { isMultiple: true }); toast(r ? '已傳到 LINE' : '已取消'); }
  catch (e) { toast('傳送失敗：' + e.message); }
}

let ME = null, WALLS = [], TAB = ['card', 'walls', 'new'].includes(PARAMS.get('tab')) ? PARAMS.get('tab') : 'card', ROUTE = { view: 'tabs' };
const DRAFT_KEY = 'pw.draft';
const blankDraft = () => ({ title: '', tag: '同心代禱', verse: verseText(VERSES[0]), desc: DEFAULT_DESC, groups: [{ name: '', from: '' }], allowAdd: true, theme: 'pom' });
let draft = blankDraft();
let editDraft = null;

async function platformFlow() {
  resetTheme();
  try { const saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); if (saved && saved.groups) draft = { ...blankDraft(), ...saved }; } catch (e) {}
  const imp = PARAMS.get('import') || (/[#&]n=/.test(location.hash) ? location.hash : '');
  if (imp) { PENDING_IMPORT = decodeList(imp); if (PENDING_IMPORT) TAB = 'card'; }
  const cached = cacheGet('platform'), cachedCard = cacheGet('card'), cx = cacheGet('cardx');
  const boot = Promise.all([api('me'), api('listWalls'), api('getCard')]);
  const manageId = PARAMS.get('manage');
  const apply = ([me, r, c]) => { ME = me; WALLS = r.walls; CARD = c.card; ON_WALL = c.onWall || {}; JOINED = c.walls || []; cacheSet('platform', { me: ME, walls: WALLS }); cacheSet('card', CARD); cacheSet('cardx', { onWall: ON_WALL, walls: JOINED }); };
  const first = () => {
    if (manageId && WALLS.some(w => w.id === manageId)) { TAB = 'walls'; go({ view: 'detail', id: manageId }); }
    else { render(); if (!PARAMS.has('notour')) maybeStartTour(); }
  };
  if (cached && cached.me && cachedCard) {
    ME = cached.me; WALLS = cached.walls || []; CARD = cachedCard; ON_WALL = (cx && cx.onWall) || {}; JOINED = (cx && cx.walls) || [];
    first();
    boot.then(res => { apply(res); softRefresh(); }).catch(e => toast(e.message));
    return;
  }
  view(loading());
  apply(await boot);
  first();

function softRefresh() {
  const n = document.querySelector('[data-tab=walls] .n'); if (n) n.textContent = WALLS.length + JOINED.filter(w => !WALLS.some(x => x.id === w.id)).length;

}

const saveDraft = () => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch (e) {} };
function go(route) { ROUTE = route; render(); }

function render() {
  resetTheme();
  if (ROUTE.view === 'detail') return renderDetail(ROUTE.id);
  if (ROUTE.view === 'edit') return renderEdit(ROUTE.id);
  if (ROUTE.view === 'towall') return renderToWall();

  view(`
    <header class="top"><a class="brand" href="./" id="home"><span class="logo">${pomSvg()}</span><div><h1>同心代禱</h1><p class="sub">個人代禱卡・團體代禱牆</p></div></a><button class="help" id="help" type="button" aria-label="使用教學">?</button></header>
    ${DEMO ? `<p class="demo-note">預覽模式：目前使用範例資料。</p>` : ''}
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="${TAB === 'card'}" data-tab="card">我的代禱卡</button>
      <button role="tab" aria-selected="${TAB === 'walls'}" data-tab="walls">代禱牆<span class="n">${wallCount}</span></button>

  $('home').onclick = e => { e.preventDefault(); TAB = 'card'; go({ view: 'tabs' }); };
  if ($('install-link')) $('install-link').onclick = startInstall;
  if (TAB === 'new') renderCompose(); else if (TAB === 'walls') renderWallsTab(); else renderCard();
}

/** 草稿 → 預覽用的代禱牆（還沒有名單） */
function draftWall(d, base) {
  const groups = d.groups.map(g => g.name.trim()).filter(Boolean);
  const old = {}; (base ? base.list : []).forEach(g => { old[g.name] = g.names; });
  const list = d.groups.filter(g => g.name.trim()).map(g => ({ name: g.name.trim(), names: old[g.from || g.name.trim()] || [] }));
  const filled = list.filter(g => g.names.length).length;
  return { ...d, id: base ? base.id : 'preview', groups, list, total: list.reduce((s, g) => s + g.names.length, 0), filled, unfilled: list.length - filled, open: base ? base.open : true };
}

function wallForm(d, base) {
  return `

let lastGroupInput = null;
function bindWallForm(d, base, onChange) {
  const pv = () => { $('pv').innerHTML = cardHtml(draftWall(d, base)); onChange && onChange(); };
  const counts = {}; (base ? base.list : []).forEach(g => { counts[g.name] = g.names.length; });
  const drawRows = focusLast => {
    $('group-rows').innerHTML = d.groups.map((g, i) => {
      const n = counts[g.from || ''] || 0;
      return `<div class="group-row"><input class="inp" data-g="${i}" maxlength="20" value="${esc(g.name)}" placeholder="排的名稱" aria-label="第 ${i + 1} 個排">${n ? `<span class="n">${n} 位</span>` : ''}<button class="icon-btn" type="button" data-gdel="${i}" aria-label="移除這個排">×</button></div>`;
    }).join('');
    document.querySelectorAll('[data-g]').forEach(inp => {
      inp.oninput = () => { d.groups[+inp.dataset.g].name = inp.value; pv(); };
      inp.onfocus = () => { lastGroupInput = inp; };
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); d.groups.splice(+inp.dataset.g + 1, 0, { name: '', from: '' }); drawRows(); const nx = document.querySelector(`[data-g="${+inp.dataset.g + 1}"]`); nx && nx.focus(); } };
    });
    document.querySelectorAll('[data-gdel]').forEach(b => b.onclick = () => {
      const i = +b.dataset.gdel, g = d.groups[i], n = counts[g.from || ''] || 0;
      const remove = () => { d.groups.splice(i, 1); if (!d.groups.length) d.groups.push({ name: '', from: '' }); drawRows(); pv(); };
      if (!n) return remove();
      if (!b.classList.contains('armed')) toast(`這個排有 ${n} 位，儲存後名單會一起刪除。再按一次 × 確定移除`);
      armThen(b, '!', remove);
    });
    if (focusLast) { const all = document.querySelectorAll('[data-g]'); all[all.length - 1].focus(); }
  };
  drawRows();
  $('w-title').oninput = e => { d.title = e.target.value; pv(); };
  $('w-tag').oninput = e => { d.tag = e.target.value; pv(); };
  $('w-verse').oninput = e => { d.verse = e.target.value; pv(); };
  $('w-desc').oninput = e => { d.desc = e.target.value; onChange && onChange(); };
  document.querySelectorAll('[data-verse]').forEach(b => b.onclick = () => { const i = +b.dataset.verse; d.verse = i < 0 ? '' : verseText(VERSES[i]); $('w-verse').value = d.verse; pv(); });
  $('g-add').onclick = () => { d.groups.push({ name: '', from: '' }); drawRows(true); };
  $('g-bulk').onclick = () => { $('bulk-box').hidden = !$('bulk-box').hidden; if (!$('bulk-box').hidden) $('bulk').focus(); };
  $('bulk-ok').onclick = () => {
    const add = String($('bulk').value).split(/\n+/).map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
    if (!add.length) return toast('請輸入排的名稱，一行一個');
    d.groups = d.groups.filter(g => g.name.trim() || g.from);
    add.forEach(name => { if (!d.groups.some(g => g.name.trim() === name)) d.groups.push({ name, from: '' }); });
    $('bulk').value = ''; $('bulk-box').hidden = true; drawRows(); pv(); toast(`已加入 ${add.length} 個排`);
  };
  $('g-home').onmousedown = e => e.preventDefault(); // 不要讓輸入框失去焦點
  $('g-home').onclick = () => {
    const inp = lastGroupInput && lastGroupInput.isConnected ? lastGroupInput : null;
    if (!inp) return toast('請先點一下要加上 🏠 的排名');
    const g = d.groups[+inp.dataset.g];
    g.name = g.name.startsWith('🏠') ? g.name.replace(/^🏠\s*/, '') : '🏠' + g.name;
    inp.value = g.name; inp.focus(); pv();
  };
  $('w-allow').onchange = e => { d.allowAdd = e.target.checked; onChange && onChange(); };
  document.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => { d.theme = b.dataset.theme; document.querySelectorAll('[data-theme]').forEach(x => x.setAttribute('aria-pressed', x === b)); pv(); });
}

const toPayload = d => ({ title: d.title.trim(), tag: d.tag.trim(), verse: d.verse.trim(), desc: d.desc.trim(), allowAdd: d.allowAdd, theme: d.theme,
  groups: d.groups.map(g => ({ name: g.name.replace(/\s+/g, ' ').trim(), from: g.from || '' })).filter(g => g.name) });
function formProblem(d) {
  const p = toPayload(d);
  if (!p.title) return ['請填寫代禱牆名稱', 'w-title'];
  if (!p.groups.length && !p.allowAdd) return ['請至少設定一個排，或開放成員自己新增排', 'group-rows'];
  const names = p.groups.map(g => g.name), dup = names.find((n, i) => names.indexOf(n) !== i);
  if (dup) return [`「${dup}」重複了`, 'group-rows'];
  return null;
}

function renderCompose() {
  $('panel').innerHTML = wallForm(draft);
  bindWallForm(draft, null, saveDraft);
  $('send').onclick = createAndSend;
}

async function createAndSend() {
  const bad = formProblem(draft);
  if (bad) { toast(bad[0]); const el = $(bad[1]); el && el.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  const btn = $('send'); btn.disabled = true; btn.textContent = '建立中…';
  try {
    const { wall } = await api('createWall', { wall: toPayload(draft) });
    WALLS.unshift({ ...wall, mine: true }); cacheSet('platform', { me: ME, walls: WALLS });
    if (!JOINED.some(x => x.id === wall.id)) JOINED.unshift({ ...wall, mine: true });
    draft = blankDraft(); try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    TAB = 'walls'; go({ view: 'detail', id: wall.id });
    await share(wall);
  } catch (e) { toast(e.message); btn.disabled = false; btn.innerHTML = `${ICON_SEND}建立並傳到 LINE 群組`; }
}

/* ---------- 代禱牆管理頁 ---------- */
async function renderDetail(id) {
  let w = WALLS.find(x => x.id === id);
  const draw = () => drawDetail(w);
  if (w) draw(); else view(loading());
  try {
    const r = await api('wall', { wallId: id });
    w = r.wall; const i = WALLS.findIndex(x => x.id === id); if (i >= 0) WALLS[i] = { ...WALLS[i], ...w };
    if (ROUTE.view === 'detail' && ROUTE.id === id) { const y = window.scrollY; draw(); window.scrollTo(0, y); }
  } catch (e) { if (!w) { toast(e.message); go({ view: 'tabs' }); } }
}

function textList(w) {
  return [`🙏 ${w.title}`, `共 ${w.total} 位福音朋友，${w.filled} 個排已填`, '']
    .concat(w.list.filter(g => g.names.length).map(g => `【${g.name}】${g.names.length} 位\n${g.names.map(n => n.name).join('、')}`))
    .concat(w.list.some(g => !g.names.length) ? ['', `還沒有名單：${w.list.filter(g => !g.names.length).map(g => g.name).join('、')}`] : []).join('\n');
}

function drawDetail(w) {
  applyTheme(w);
  view(`
    <div class="subbar"><button class="back" id="back">‹ 返回</button><h1>${esc(w.title)}</h1><span></span></div>
    <section class="pv-panel"><div class="pv-label"><span class="t">目前的圖卡</span><small>${w.open ? '填寫中' : '已停止填寫'}</small></div>${cardHtml(w)}</section>
    <button class="btn line" id="d-share">${ICON_SEND}傳到 LINE 群組</button>
    <div class="btn-grid">
      <button class="btn" id="d-open">打開填寫頁</button>
      <button class="btn" id="d-edit">編輯內容與排</button>
      <button class="btn code" id="d-copy">複製文字名單</button>
      <button class="btn ghost" id="d-toggle">${w.open ? '停止填寫' : '重新開放填寫'}</button>
    </div>
    <section class="card dot" style="margin-top:18px">
      <h2>各排代禱名單 <small>共 ${w.total} 位</small></h2>

    </section>
    <button class="btn danger" id="d-del">刪除這面代禱牆</button>
    <p class="hint" style="text-align:center">刪除後名單也會一起刪除，群組裡的舊圖卡會打不開。</p>`);
  $('back').onclick = () => { if (PARAMS.has('manage')) history.replaceState(null, '', location.pathname + (DEMO ? '?demo' : '')); TAB = 'walls'; go({ view: 'tabs' }); };
  $('d-share').onclick = () => share(w);
  $('d-open').onclick = () => { location.href = `${location.pathname}?wall=${encodeURIComponent(w.id)}${DEMO ? '&demo' : ''}`; };
  $('d-edit').onclick = () => go({ view: 'edit', id: w.id });
  $('d-copy').onclick = () => navigator.clipboard.writeText(textList(w)).then(() => toast('已複製，可以貼到記事本或聊天室'), () => toast('無法複製'));
